<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Weekly Fit - 每週運動追蹤</title>

  <!-- Web App 相關設定 (iOS PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Weekly Fit">

  <!-- 動態 Apple Touch Icon 與 Favicon 載入 Anchor -->
  <link id="dynamicAppleIcon" rel="apple-touch-icon" sizes="180x180" href="">
  <link id="dynamicFavicon" rel="icon" type="image/png" href="">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    *, ::before, ::after {
      box-sizing: border-box;
    }

    /* 針對 iOS iPhone 全螢幕 PWA 模式支援 Safe Area 避開動態島與狀態列 */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f8fafc;
      /* 使用 max 確保在 Safeway / PWA 獨立視窗下都有足夠的頂部留白 */
      padding-top: max(var(--sat), 16px);
      padding-bottom: max(var(--sab), 24px);
    }

    /* 固定式頂部導覽列支援 iOS 安全區域 */
    .ios-safe-header {
      padding-top: max(var(--sat), 12px);
    }

    /* 針對 iOS 調整 input 安全性與樣式 */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* 徹底修正 iOS Safari 原生 <input type="date"> 寬度溢出與跑版問題 */
    input[type="date"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      display: block;
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      background-color: #f8fafc;
      min-height: 44px;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen antialiased selection:bg-sky-500 selection:text-white">

  <!-- 頂部 Navigation Header (加入 iOS safe-area-inset-top 避開動態島/時間列) -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200/80 px-4 pb-3 ios-safe-header">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <!-- App Logo & Title -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center text-sky-400 shadow-sm shrink-0">
          <i class="fa-solid font-bold text-lg fa-heart-pulse"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-lg leading-tight">Weekly Fit</h1>
          <div class="flex items-center space-x-1.5 text-xs text-emerald-600 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>離線可用</span>
          </div>
        </div>
      </div>

      <!-- 頁籤分頁按鈕 -->
      <div class="bg-slate-100 p-1 rounded-xl flex items-center border border-slate-200 shrink-0">
        <button id="tabCurrentBtn" onclick="switchTab('current')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 bg-white text-slate-800 shadow-sm">
          本週累計
        </button>
        <button id="tabHistoryBtn" onclick="switchTab('history')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-500 hover:text-slate-700">
          歷史歸檔 <span id="historyBadge" class="ml-0.5 px-1.5 py-0.2 bg-slate-200 text-slate-600 rounded-full text-[10px]">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主要內容區域 -->
  <main class="max-w-xl mx-auto px-4 mt-4 space-y-5">
            編輯日期
          </button>
        </div>

        <div class="flex items-center justify-between my-2">
          <div>
            <div class="flex items-baseline space-x-1.5">
              <span id="currentTotalMinutes" class="text-4xl font-extrabold text-slate-900 tracking-tight">0</span>
              <span class="text-sm font-medium text-slate-500">分鐘</span>
              <span id="currentTotalHours" class="text-xs text-slate-400 font-normal ml-1">(0.0 小時)</span>
            </div>
          </div>
          
          <!-- 環形進度 / 百分比 -->
          <div class="relative w-16 h-16 flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
              <path class="text-slate-100" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              <path id="progressCircle" class="text-sky-500 transition-all duration-500 ease-out" stroke-dasharray="0, 100" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            </svg>
            <span id="progressPercent" class="absolute text-xs font-bold text-slate-700">0%</span>
          </div>
        </div>

        <!-- 目標對比條 -->
        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs sm:text-sm">
          <div class="flex items-center space-x-2">
            <span class="text-slate-500">目標：<strong id="targetMinutesDisplay" class="text-slate-800 font-semibold">150</strong> 分鐘</span>
            <button onclick="openTargetModal()" class="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-xs font-medium border border-slate-200 transition">
              編輯
            </button>
          </div>
          <span id="remainingMinutesDisplay" class="text-slate-500 font-medium">還差 150 分鐘</span>
        </div>

        <!-- Zone 心率分佈列 -->
        <div class="mt-4 space-y-2">
          <div class="flex justify-between text-xs font-medium text-slate-500">
            <span>心率區間分佈</span>
            <span id="zoneDistributionSummary">尚無記錄</span>
          </div>
          <div class="h-2.5 w-full bg-slate-100 rounded-full overflow-hidden flex" id="zoneProgressBar">
            <div id="zone1Bar" class="bg-slate-400 h-full transition-all duration-300" style="width: 0%" title="Zone 1"></div>
            <div id="zone2Bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%" title="Zone 2"></div>
            <div id="zone3Bar" class="bg-amber-500 h-full transition-all duration-300" style="width: 0%" title="Zone 3"></div>
            <div id="zone4Bar" class="bg-orange-500 h-full transition-all duration-300" style="width: 0%" title="Zone 4"></div>
            <div id="zone5Bar" class="bg-rose-500 h-full transition-all duration-300" style="width: 0%" title="Zone 5"></div>
          </div>
          <!-- 圖例 -->
          <div class="flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-slate-500 pt-1">
            <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>Zone 2 (燃脂)</div>
            <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500"></span>Zone 3 (有氧)</div>
            <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-400"></span>其他 Zone</div>
          </div>
        </div>

        <!-- 存檔結算按鈕 -->
        <div class="mt-5 pt-3 border-t border-slate-100 flex justify-end">
          <button onclick="archiveCurrentWeek()" class="w-full sm:w-auto px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-sm transition active:scale-95 flex items-center justify-center gap-2">
            <i class="fa-solid fa-box-archive"></i>
            <span>開始新的一週 (存檔結算)</span>
          </button>
        </div>
      </section>

      <!-- 新增運動紀錄 Form -->
      <section class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-4">
        <h2 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <i class="fa-solid fa-circle-plus text-sky-500"></i>
          <span>新增運動紀錄</span>
        </h2>

        <form id="addRecordForm" onsubmit="handleAddRecord(event)" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <!-- 日期選擇器下拉 -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">日期</label>
              <select id="recordDateSelect" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white text-slate-800">
                <!-- JS 動態生成該週 7 天選項 -->
              </select>
            </div>

            <!-- 運動種類 -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">運動種類</label>
              <select id="recordTypeSelect" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white text-slate-800">
                <option value="" disabled selected>請選擇...</option>
                <option value="慢跑/超慢跑">慢跑 / 超慢跑</option>
                <option value="快走/斜坡走">快走 / 斜坡走</option>
                <option value="單車/飛輪">單車 / 飛輪</option>
                <option value="游泳">游泳</option>
                <option value="划船機/橢圓機">划船機 / 橢圓機</option>
                <option value="重量訓練">重量訓練</option>
                <option value="高強度間歇(HIIT)">高強度間歇 (HIIT)</option>
                <option value="其他運動">其他運動</option>
              </select>
            </div>
          </div>

          <!-- 心率區間 Zone -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">心率區間 (Zone)</label>
            <select id="recordZoneSelect" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white text-slate-800">
              <option value="" disabled selected>請選擇...</option>
              <option value="Zone 1">Zone 1 (熱身恢復 / &lt;60% Max HR)</option>
              <option value="Zone 2">Zone 2 (最佳燃脂 / 60-70% Max HR)</option>
              <option value="Zone 3">Zone 3 (有氧耐力 / 70-80% Max HR)</option>
              <option value="Zone 4">Zone 4 (無氧閾值 / 80-90% Max HR)</option>
              <option value="Zone 5">Zone 5 (極限爆發 / 90-100% Max HR)</option>
            </select>
          </div>

          <!-- 時長與快速加總按鈕 -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-semibold text-slate-600">時長 (分鐘)</label>
              <div class="flex gap-1">
                <button type="button" onclick="quickAddMinutes(15)" class="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-xs border border-slate-200">+15</button>
                <button type="button" onclick="quickAddMinutes(30)" class="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-xs border border-slate-200">+30</button>
                <button type="button" onclick="quickAddMinutes(45)" class="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-xs border border-slate-200">+45</button>
                <button type="button" onclick="quickAddMinutes(60)" class="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-xs border border-slate-200">+60</button>
              </div>
            </div>
            <input type="number" id="recordMinutesInput" inputmode="numeric" pattern="[0-9]*" min="1" max="1000" placeholder="例如：30" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white text-slate-800">
          </div>

          <!-- 備註 -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">備註 (選填)</label>
            <input type="text" id="recordNoteInput" placeholder="例如：坡度 6%、平均心率 138" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white text-slate-800">
          </div>

          <!-- 送出按鈕 -->
          <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-3 rounded-xl text-sm shadow-md transition duration-200 active:scale-[0.99] flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus"></i>
            <span>加入運動紀錄</span>
          </button>
        </form>
      </section>

      <!-- 本週運動明細列表 -->
      <section class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-3">
        <h2 class="font-bold text-slate-800 text-base flex items-center justify-between">
          <span>本週紀錄明細</span>
          <span id="recordsCountBadge" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">0 筆</span>
        </h2>

        <div id="recordsList" class="space-y-2.5">
          <!-- 紀錄動態渲染區域 -->
        </div>
      </section>

    </div>

    <!-- VIEW 2: 歷史歸檔 View -->
    <div id="viewHistory" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
        <h2 class="font-bold text-slate-800 text-base mb-1">過往每週歸檔紀錄</h2>
        <p class="text-xs text-slate-500 mb-4">回顧歷史目標達成率與運動時長累積。</p>
        
        <div id="historyList" class="space-y-3">
          <!-- 歷史歸檔動態渲染 -->
        </div>
      </div>
    </div>

  </main>

  <!-- MODAL 1: 編輯每週目標 -->
  <div id="targetModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-xl space-y-4 transform transition-all overflow-hidden">
      <h3 class="font-bold text-slate-900 text-base">設定每週目標分鐘數</h3>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">目標分鐘數</label>
        <input type="number" id="targetModalInput" inputmode="numeric" pattern="[0-9]*" min="10" max="5000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-base font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeTargetModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition">取消</button>
        <button onclick="saveTargetModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-sky-500 text-white hover:bg-sky-600 transition shadow-sm">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: 選擇本週起始日期 (修正溢出與跑版) -->
  <div id="dateRangeModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-xl space-y-4 transform transition-all overflow-hidden">
      <h3 class="font-bold text-slate-900 text-base">選擇本週起始日期</h3>
      <p class="text-xs text-slate-500 leading-relaxed">選擇一天的日期，系統將自動計算並設定 7 天的時間區間。</p>
      
      <div class="w-full overflow-hidden">
        <label class="block text-xs font-medium text-slate-500 mb-1">起始日期</label>
        <input type="date" id="startDatePicker" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white">
      </div>

      <div class="p-3 bg-sky-50 rounded-xl border border-sky-100 text-xs text-sky-800 space-y-1">
        <span class="font-medium block">自動生成時間區間：</span>
        <span id="calculatedRangePreview" class="font-bold block">2026/10/25 ~ 2026/10/31</span>
      </div>

      <div class="flex justify-end gap-2 pt-1">
        <button onclick="closeDateRangeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition">取消</button>
        <button onclick="saveDateRangeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-sky-500 text-white hover:bg-sky-600 transition shadow-sm">確定更新</button>
      </div>
    </div>
  </div>

  <!-- JavaScript 邏輯控制 -->
  <script>
    // 預設資料結構
    const DEFAULT_TARGET = 150;
    
    let appState = {
      targetMinutes: DEFAULT_TARGET,
      startDate: '', // YYYY-MM-DD
      endDate: '',   // YYYY-MM-DD
      records: [],
      history: []
    };

    // 使用 HTML5 Canvas 動態繪製與生成 iOS 相容的 PNG 主畫面 Apple Touch Icon
    function generateAppleTouchIconPNG() {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');

      // 1. 繪製深圓角背景 (Dark Slate #0f172a)
      const radius = 40;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(180 - radius, 0);
      ctx.quadraticCurveTo(180, 0, 180, radius);
      ctx.lineTo(180, 180 - radius);
      ctx.quadraticCurveTo(180, 180, 180 - radius, 180);
      ctx.lineTo(radius, 180);
      ctx.quadraticCurveTo(0, 180, 0, 180 - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      // 2. 繪製心電圖/脈搏波形 (Sky Blue #38bdf8)
      ctx.beginPath();
      ctx.moveTo(25, 90);
      ctx.lineTo(55, 90);
      ctx.lineTo(68, 55);
      ctx.lineTo(85, 125);
      ctx.lineTo(102, 70);
      ctx.lineTo(115, 90);
      ctx.lineTo(155, 90);

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();

      // 3. 波峰亮點
      ctx.beginPath();
      ctx.arc(85, 125, 4, 0, 2 * Math.PI);
      ctx.fillStyle = '#38bdf8';
      ctx.fill();

      // 轉為 Base64 PNG Data URI 避開 iOS 對 SVG icon 的不支援問題
      const dataUrl = canvas.toDataURL('image/png');
      
      const appleIconElem = document.getElementById('dynamicAppleIcon');
      const faviconElem = document.getElementById('dynamicFavicon');
      if (appleIconElem) appleIconElem.href = dataUrl;
      if (faviconElem) faviconElem.href = dataUrl;
    }

    // 頁面載入初始化
    window.onload = function() {
      // 繪製並注入 iOS Apple Touch Icon
      generateAppleTouchIconPNG();

      loadStateFromStorage();
      
      if (!appState.startDate) {
        initDefaultWeek(new Date());
      }
      
      const picker = document.getElementById('startDatePicker');
      picker.addEventListener('change', function(e) {
        if (e.target.value) {
          const range = calculate7DaysRange(e.target.value);
          document.getElementById('calculatedRangePreview').innerText = range.rangeStr;
        }
      });

      renderApp();
    };

    function loadStateFromStorage() {
      const saved = localStorage.getItem('weekly_fit_state_v2');
      if (saved) {
        try {
          appState = JSON.parse(saved);
        } catch (e) {
          console.error('Failed to parse state:', e);
        }
      }
    }

    function saveStateToStorage() {
      localStorage.setItem('weekly_fit_state_v2', JSON.stringify(appState));
    }

    function calculate7DaysRange(startDateString) {
      const start = new Date(startDateString);
      const end = new Date(start);
      end.setDate(end.getDate() + 6);

      const formatDate = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      };

      const startFormatted = formatDate(start);
      const endFormatted = formatDate(end);

      return {
        startIso: startDateString,
        endIso: end.toISOString().split('T')[0],
        rangeStr: `${startFormatted} ~ ${endFormatted}`
      };
    }

    function initDefaultWeek(baseDate) {
      const year = baseDate.getFullYear();
      const month = String(baseDate.getMonth() + 1).padStart(2, '0');
      const day = String(baseDate.getDate()).padStart(2, '0');
      const isoToday = `${year}-${month}-${day}`;

      const range = calculate7DaysRange(isoToday);
      appState.startDate = isoToday;
      appState.endDate = range.endIso;
      appState.records = [];
      saveStateToStorage();
    }

    function renderApp() {
      renderCurrentOverview();
      renderDateDropdownOptions();
      renderRecordsList();
      renderHistoryList();
    }

    function renderCurrentOverview() {
      const range = calculate7DaysRange(appState.startDate);
      document.getElementById('currentWeekRangeDisplay').innerText = range.rangeStr;

      const totalMinutes = appState.records.reduce((sum, r) => sum + Number(r.minutes), 0);
      const totalHours = (totalMinutes / 60).toFixed(1);

      document.getElementById('currentTotalMinutes').innerText = totalMinutes;
      document.getElementById('currentTotalHours').innerText = `(${totalHours} 小時)`;
      document.getElementById('targetMinutesDisplay').innerText = appState.targetMinutes;

      const remaining = appState.targetMinutes - totalMinutes;
      const remainingElem = document.getElementById('remainingMinutesDisplay');
      if (remaining > 0) {
        remainingElem.innerText = `還差 ${remaining} 分鐘`;
        remainingElem.className = 'text-slate-500 font-medium';
      } else {
        remainingElem.innerText = `已達標 (${Math.abs(remaining)} 分鐘)`;
        remainingElem.className = 'text-emerald-600 font-bold';
      }

      const percent = appState.targetMinutes > 0 ? Math.min(Math.round((totalMinutes / appState.targetMinutes) * 100), 100) : 0;
      document.getElementById('progressPercent').innerText = `${percent}%`;
      document.getElementById('progressCircle').setAttribute('stroke-dasharray', `${percent}, 100`);

      renderZoneBar(totalMinutes);
    }

    function renderZoneBar(totalMinutes) {
      const zoneMinutes = { 'Zone 1': 0, 'Zone 2': 0, 'Zone 3': 0, 'Zone 4': 0, 'Zone 5': 0 };
      appState.records.forEach(r => {
        if (zoneMinutes[r.zone] !== undefined) {
          zoneMinutes[r.zone] += Number(r.minutes);
        }
      });

      const getWidth = (min) => totalMinutes > 0 ? `${(min / totalMinutes) * 100}%` : '0%';

      document.getElementById('zone1Bar').style.width = getWidth(zoneMinutes['Zone 1']);
      document.getElementById('zone2Bar').style.width = getWidth(zoneMinutes['Zone 2']);
      document.getElementById('zone3Bar').style.width = getWidth(zoneMinutes['Zone 3']);
      document.getElementById('zone4Bar').style.width = getWidth(zoneMinutes['Zone 4']);
      document.getElementById('zone5Bar').style.width = getWidth(zoneMinutes['Zone 5']);

      const summaryElem = document.getElementById('zoneDistributionSummary');
      if (totalMinutes === 0) {
        summaryElem.innerText = '尚無記錄';
      } else {
        summaryElem.innerText = `Zone 2: ${zoneMinutes['Zone 2']}分 / Zone 3: ${zoneMinutes['Zone 3']}分`;
      }
    }

    function renderDateDropdownOptions() {
      const selectElem = document.getElementById('recordDateSelect');
      selectElem.innerHTML = '';

      const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
      const start = new Date(appState.startDate);

      for (let i = 0; i < 7; i++) {
        const cur = new Date(start);
        cur.setDate(cur.getDate() + i);

        const y = cur.getFullYear();
        const m = String(cur.getMonth() + 1).padStart(2, '0');
        const d = String(cur.getDate()).padStart(2, '0');
        const dayOfWeek = dayNames[cur.getDay()];

        const dateDisplay = `${y}/${m}/${d} (${dayOfWeek})`;
        const optionVal = `${y}/${m}/${d}`;

        const option = document.createElement('option');
        option.value = optionVal;
        option.dataset.dayName = dayOfWeek;
        option.innerText = dateDisplay;

        selectElem.appendChild(option);
      }
    }

    function handleAddRecord(e) {
      e.preventDefault();

      const dateSelect = document.getElementById('recordDateSelect');
      const selectedOption = dateSelect.options[dateSelect.selectedIndex];
      
      const dateStr = dateSelect.value;
      const dayOfWeek = selectedOption ? selectedOption.dataset.dayName : '';
      const type = document.getElementById('recordTypeSelect').value;
      const zone = document.getElementById('recordZoneSelect').value;
      const minutes = parseInt(document.getElementById('recordMinutesInput').value, 10);
      const note = document.getElementById('recordNoteInput').value.trim();

      if (!type || !zone || !minutes || minutes <= 0) {
        alert('請填寫完整的運動資訊');
        return;
      }

      const newRecord = {
        id: 'rec_' + Date.now(),
        dateStr,
        dayOfWeek,
        type,
        zone,
        minutes,
        note,
        timestamp: Date.now()
      };

      appState.records.unshift(newRecord);
      saveStateToStorage();
      renderApp();

      document.getElementById('recordMinutesInput').value = '';
      document.getElementById('recordNoteInput').value = '';
    }

    function quickAddMinutes(val) {
      const input = document.getElementById('recordMinutesInput');
      const current = parseInt(input.value, 10) || 0;
      input.value = current + val;
    }

    function renderRecordsList() {
      const container = document.getElementById('recordsList');
      const badge = document.getElementById('recordsCountBadge');
      container.innerHTML = '';

      badge.innerText = `${appState.records.length} 筆`;

      if (appState.records.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 bg-slate-50 rounded-xl border border-dashed border-slate-200">
            <i class="fa-solid fa-person-running text-slate-300 text-3xl mb-2"></i>
            <p class="text-xs text-slate-400 font-medium">本週尚無運動紀錄，點擊上方新增吧！</p>
          </div>
        `;
        return;
      }

      appState.records.forEach(rec => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100/80 rounded-xl border border-slate-200/70 transition';

        let zoneBadgeClass = 'bg-slate-200 text-slate-700';
        if (rec.zone === 'Zone 2') zoneBadgeClass = 'bg-emerald-100 text-emerald-800 border border-emerald-200';
        if (rec.zone === 'Zone 3') zoneBadgeClass = 'bg-amber-100 text-amber-800 border border-amber-200';
        if (rec.zone === 'Zone 4') zoneBadgeClass = 'bg-orange-100 text-orange-800 border border-orange-200';
        if (rec.zone === 'Zone 5') zoneBadgeClass = 'bg-rose-100 text-rose-800 border border-rose-200';

        item.innerHTML = `
          <div class="space-y-1">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-bold text-slate-700">${rec.dateStr} (${rec.dayOfWeek})</span>
              <span class="font-semibold text-xs sm:text-sm text-slate-900">${rec.type}</span>
              <span class="text-[10px] px-2 py-0.5 rounded-md font-medium ${zoneBadgeClass}">${rec.zone}</span>
            </div>
            ${rec.note ? `<p class="text-xs text-slate-500 flex items-center gap-1"><i class="fa-regular fa-comment-dots text-[10px]"></i> ${rec.note}</p>` : ''}
          </div>
          <div class="flex items-center space-x-3">
            <span class="text-sm font-extrabold text-slate-800">${rec.minutes} <span class="text-xs font-normal text-slate-500">分</span></span>
            <button onclick="deleteRecord('${rec.id}')" class="text-slate-400 hover:text-rose-500 p-1 transition" title="刪除紀錄">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function deleteRecord(id) {
      appState.records = appState.records.filter(r => r.id !== id);
      saveStateToStorage();
      renderApp();
    }

    function archiveCurrentWeek() {
      if (appState.records.length === 0) {
        if (!confirm('本週尚無任何運動紀錄，確定要直接歸檔並開始新的一週嗎？')) return;
      } else {
        if (!confirm('確定要結算本週紀錄並存檔嗎？本週數據將移至「歷史歸檔」。')) return;
      }

      const totalMinutes = appState.records.reduce((sum, r) => sum + Number(r.minutes), 0);
      const range = calculate7DaysRange(appState.startDate);

      const historyEntry = {
        id: 'hist_' + Date.now(),
        rangeStr: range.rangeStr,
        targetMinutes: appState.targetMinutes,
        totalMinutes: totalMinutes,
        recordsCount: appState.records.length,
        records: [...appState.records],
        archivedAt: new Date().toLocaleDateString('zh-TW')
      };

      appState.history.unshift(historyEntry);

      const nextStart = new Date(appState.endDate);
      nextStart.setDate(nextStart.getDate() + 1);
      
      initDefaultWeek(nextStart);
      renderApp();

      alert('結算完成！已開啟全新一週。');
    }

    function renderHistoryList() {
      const container = document.getElementById('historyList');
      const badge = document.getElementById('historyBadge');
      container.innerHTML = '';

      badge.innerText = appState.history.length;

      if (appState.history.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-xs">
            尚無歷史歸檔資料
          </div>
        `;
        return;
      }

      appState.history.forEach(item => {
        const percent = item.targetMinutes > 0 ? Math.round((item.totalMinutes / item.targetMinutes) * 100) : 0;
        const isAchieved = percent >= 100;

        const card = document.createElement('div');
        card.className = 'p-4 bg-slate-50 rounded-xl border border-slate-200/80 space-y-2';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-700">${item.rangeStr}</span>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${isAchieved ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}">
              ${isAchieved ? '達標 ' + percent + '%' : '完成 ' + percent + '%'}
            </span>
          </div>
          <div class="flex justify-between items-baseline text-xs text-slate-600">
            <span>累積：<strong class="text-slate-900 font-bold text-sm">${item.totalMinutes}</strong> / ${item.targetMinutes} 分鐘</span>
            <span class="text-[11px] text-slate-400">${item.recordsCount} 筆運動紀錄</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openTargetModal() {
      document.getElementById('targetModalInput').value = appState.targetMinutes;
      document.getElementById('targetModal').classList.remove('hidden');
    }
    function closeTargetModal() {
      document.getElementById('targetModal').classList.add('hidden');
    }
    function saveTargetModal() {
      const val = parseInt(document.getElementById('targetModalInput').value, 10);
      if (val && val > 0) {
        appState.targetMinutes = val;
        saveStateToStorage();
        renderApp();
        closeTargetModal();
      } else {
        alert('請輸入有效的數字');
      }
    }

    function openDateRangeModal() {
      document.getElementById('startDatePicker').value = appState.startDate;
      const range = calculate7DaysRange(appState.startDate);
      document.getElementById('calculatedRangePreview').innerText = range.rangeStr;
      document.getElementById('dateRangeModal').classList.remove('hidden');
    }
    function closeDateRangeModal() {
      document.getElementById('dateRangeModal').classList.add('hidden');
    }
    function saveDateRangeModal() {
      const pickerVal = document.getElementById('startDatePicker').value;
      if (pickerVal) {
        const range = calculate7DaysRange(pickerVal);
        appState.startDate = range.startIso;
        appState.endDate = range.endIso;
        saveStateToStorage();
        renderApp();
        closeDateRangeModal();
      } else {
        alert('請選擇有效的日期');
      }
    }

    function switchTab(tab) {
      const currentView = document.getElementById('viewCurrent');
      const historyView = document.getElementById('viewHistory');
      const tabCurrentBtn = document.getElementById('tabCurrentBtn');
      const tabHistoryBtn = document.getElementById('tabHistoryBtn');

      if (tab === 'current') {
        currentView.classList.remove('hidden');
        historyView.classList.add('hidden');
        tabCurrentBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 bg-white text-slate-800 shadow-sm';
        tabHistoryBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-500 hover:text-slate-700';
      } else {
        currentView.classList.add('hidden');
        historyView.classList.remove('hidden');
        tabHistoryBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 bg-white text-slate-800 shadow-sm';
        tabCurrentBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-500 hover:text-slate-700';
      }
    }
  </script>
</body>
</html>

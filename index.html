<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Weekly Fit - 每週有氧時間追蹤</title>

    <!-- 網頁分頁圖示 (Favicon & Apple Touch Icon) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230F172A'/><path d='M80 50h-16l-12 36L36 14l-12 36H8' fill='none' stroke='%23FFFFFF' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230F172A'/><path d='M80 50h-16l-12 36L36 14l-12 36H8' fill='none' stroke='%23FFFFFF' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />

    <!-- PWA Manifest & Meta -->
    <meta name="theme-color" content="#F8FAF9" />
    <link rel="manifest" href="manifest.json" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0F172A",
              accent: "#3B82F6",
              bglight: "#F8FAF9",
              cardbg: "#FFFFFF",
              bordercolor: "#E2E8F0",
              textmuted: "#64748B",
            },
          },
        },
      };
    </script>
    <style>
      @keyframes pulse-green {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.95);
        }
      }
      .green-dot {
        animation: pulse-green 2s infinite ease-in-out;
      }
      /* 客製化下拉選單箭頭位置 */
      .custom-select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
        background-repeat: no-repeat;
        background-position: right 1rem center;
        background-size: 1.1em;
        padding-right: 2.75rem !important;
      }
    </style>
  </head>
  <body
    class="bg-bglight text-primary min-h-screen font-sans antialiased pb-12 selection:bg-blue-100"
  >
    <!-- 頂部導航列 -->
    <header
      class="sticky top-0 z-30 bg-bglight/80 backdrop-blur-md border-b border-bordercolor px-4 py-3"
    >
      <div class="max-w-md mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-2.5">
          <!-- 心率波形 Logo -->
          <div
            class="w-9 h-9 bg-[#0F172A] text-white rounded-xl flex items-center justify-center shadow-sm p-1.5"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="w-full h-full"
            >
              <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
          </div>
          <div>
            <h1
              class="font-bold text-base tracking-tight leading-tight text-primary"
            >
              Weekly Fit
            </h1>
            <span class="text-xs text-textmuted flex items-center gap-1">
              <span
                class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"
              ></span>
              離線可用
            </span>
          </div>
        </div>
        <!-- 頁籤切換 -->
        <div class="bg-bordercolor/60 p-1 rounded-xl flex text-xs font-medium">
          <button
            id="tab-current"
            onclick="switchTab('current')"
            class="px-3 py-1.5 rounded-lg bg-white shadow-sm text-primary transition-all"
          >
            本週累計
          </button>
          <button
            id="tab-history"
            onclick="switchTab('history')"
            class="px-3 py-1.5 rounded-lg text-textmuted transition-all"
          >
            歷史歸檔
            <span
              id="history-count"
              class="ml-0.5 bg-bordercolor px-1.5 py-0.2 rounded-full text-[10px]"
              >0</span
            >
          </button>
        </div>
      </div>
    </header>

    <!-- 主容器 -->
    <main class="max-w-md mx-auto px-4 mt-5 space-y-5">
      <!-- 區塊：本週累計 -->
      <div id="section-current" class="space-y-5">
        <!-- 儀表板總卡片 -->
        <div
          class="bg-cardbg border border-bordercolor rounded-2xl p-5 shadow-sm relative overflow-hidden"
        >
          <div class="flex justify-between items-start">
            <div>
              <div
                class="flex items-center space-x-2 text-xs text-textmuted mb-1"
              >
                <span
                  class="flex items-center gap-1.5 bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-md font-medium border border-emerald-200"
                >
                  <span
                    class="w-2 h-2 rounded-full bg-emerald-500 green-dot inline-block"
                  ></span>
                  進行中
                </span>
                <span id="current-date-range" class="font-medium text-textmuted"
                  >2026/10/19 ~ 2026/10/25</span
                >
                <button
                  onclick="editDateRange()"
                  class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-[11px] px-2 py-0.5 rounded-md border border-slate-200 transition-colors shadow-none ml-1"
                >
                  編輯
                </button>
              </div>
              <div class="flex items-baseline space-x-1.5 mt-2">
                <span
                  id="total-minutes"
                  class="text-4xl font-black tracking-tight"
                  >0</span
                >
                <span class="text-sm font-semibold text-textmuted">分鐘</span>
                <span id="total-hours-sub" class="text-xs text-textmuted ml-1"
                  >(0.0 小時)</span
                >
              </div>
            </div>
            <!-- 圓形進度百分比視覺 -->
            <div class="relative w-16 h-16 flex items-center justify-center">
              <svg class="w-full h-full transform -rotate-90">
                <circle
                  cx="32"
                  cy="32"
                  r="28"
                  stroke="currentColor"
                  stroke-width="5"
                  class="text-bordercolor fill-none"
                ></circle>
                <circle
                  id="progress-ring"
                  cx="32"
                  cy="32"
                  r="28"
                  stroke="currentColor"
                  stroke-width="5"
                  class="text-accent fill-none transition-all duration-500"
                  stroke-dasharray="175.93"
                  stroke-dashoffset="175.93"
                  stroke-linecap="round"
                ></circle>
              </svg>
              <span id="progress-percent" class="absolute text-xs font-bold"
                >0%</span
              >
            </div>
          </div>

          <!-- 目標與差額 -->
          <div
            class="mt-4 pt-3 border-t border-bordercolor flex justify-between items-center text-xs"
          >
            <div class="flex items-center space-x-1.5 text-textmuted">
              <span
                >目標：<strong
                  id="target-display"
                  class="text-primary font-bold"
                  >150</strong
                >
                分鐘</span
              >
              <button
                onclick="editTarget()"
                class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-[11px] px-2 py-0.5 rounded-md border border-slate-200 transition-colors shadow-none ml-1"
              >
                編輯
              </button>
            </div>
            <div id="target-status" class="font-medium text-textmuted">
              還差 150 分鐘
            </div>
          </div>

          <!-- 進度條 -->
          <div
            class="w-full bg-bordercolor/60 h-2 rounded-full mt-2 overflow-hidden"
          >
            <div
              id="progress-bar"
              class="bg-accent h-full rounded-full transition-all duration-500"
              style="width: 0%"
            ></div>
          </div>

          <!-- 心率區間分佈摘要 -->
          <div class="mt-4 pt-3 border-t border-bordercolor/60">
            <div
              class="flex justify-between items-center text-xs text-textmuted mb-1.5"
            >
              <span>心率區間分佈</span>
              <span id="zone-summary-text" class="font-medium text-primary"
                >尚無記錄</span
              >
            </div>
            <div
              id="zone-mini-bars"
              class="w-full bg-bordercolor/50 h-1.5 rounded-full flex overflow-hidden"
            >
              <!-- 動態生成分佈條 -->
            </div>
          </div>

          <!-- 歸檔新的一週按鈕 -->
          <div class="mt-4 pt-3 border-t border-bordercolor flex justify-end">
            <button
              onclick="archiveCurrentWeek()"
              class="bg-[#0F172A] text-white text-xs font-medium px-4 py-2 rounded-xl hover:bg-slate-800 transition-all shadow-sm active:scale-95 flex items-center space-x-1.5"
            >
              <span>開始新的一週 (存檔)</span>
            </button>
          </div>
        </div>

        <!-- 新增運動記錄卡片 -->
        <div
          class="bg-cardbg border border-bordercolor rounded-2xl p-5 shadow-sm space-y-4"
        >
          <h2
            class="font-bold text-sm tracking-tight flex items-center space-x-2 text-primary"
          >
            <span>新增運動記錄</span>
          </h2>

          <div class="grid grid-cols-2 gap-3">
            <!-- 星期幾 (加寬邊距 custom-select) -->
            <div>
              <label class="block text-xs font-semibold text-textmuted mb-1"
                >星期</label
              >
              <select
                id="input-day"
                class="custom-select w-full bg-bglight border border-bordercolor rounded-xl px-3.5 py-2.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-accent/50"
              >
                <option value="" disabled selected hidden>請選擇...</option>
                <option value="星期一">星期一</option>
                <option value="星期二">星期二</option>
                <option value="星期三">星期三</option>
                <option value="星期四">星期四</option>
                <option value="星期五">星期五</option>
                <option value="星期六">星期六</option>
                <option value="星期日">星期日</option>
              </select>
            </div>

            <!-- 運動種類 (加寬邊距 custom-select) -->
            <div>
              <label class="block text-xs font-semibold text-textmuted mb-1"
                >運動種類</label
              >
              <select
                id="input-type"
                class="custom-select w-full bg-bglight border border-bordercolor rounded-xl px-3.5 py-2.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-accent/50"
              >
                <option value="" disabled selected hidden>請選擇...</option>
                <option value="跑步">跑步</option>
                <option value="騎車">騎車</option>
                <option value="快走">快走</option>
                <option value="游泳">游泳</option>
                <option value="爬坡">爬坡</option>
                <option value="HIIT">HIIT</option>
                <option value="跳繩">跳繩</option>
                <option value="其他">其他</option>
              </select>
            </div>
          </div>

          <!-- 心率區間 (加寬邊距 custom-select) -->
          <div>
            <label class="block text-xs font-semibold text-textmuted mb-1"
              >心率區間 (Zone)</label
            >
            <select
              id="input-zone"
              class="custom-select w-full bg-bglight border border-bordercolor rounded-xl px-3.5 py-2.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-accent/50"
            >
              <option value="" disabled selected hidden>請選擇...</option>
              <option value="Zone 1">Zone 1 (暖身/恢復)</option>
              <option value="Zone 2">Zone 2 (燃脂/基礎有氧)</option>
              <option value="Zone 3">Zone 3 (耐力/有氧)</option>
              <option value="Zone 4">Zone 4 (無氧/閾值)</option>
              <option value="Zone 5">Zone 5 (極限/VO2 Max)</option>
            </select>
          </div>

          <!-- 時長 (分鐘) -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs font-semibold text-textmuted"
                >時長 (分鐘)</label
              >
              <!-- 快速增加按鈕 -->
              <div class="flex space-x-1">
                <button
                  type="button"
                  onclick="addMinutes(15)"
                  class="bg-bglight hover:bg-bordercolor text-primary text-[11px] font-medium px-2 py-0.5 rounded-lg border border-bordercolor transition-colors"
                >
                  +15
                </button>
                <button
                  type="button"
                  onclick="addMinutes(30)"
                  class="bg-bglight hover:bg-bordercolor text-primary text-[11px] font-medium px-2 py-0.5 rounded-lg border border-bordercolor transition-colors"
                >
                  +30
                </button>
                <button
                  type="button"
                  onclick="addMinutes(45)"
                  class="bg-bglight hover:bg-bordercolor text-primary text-[11px] font-medium px-2 py-0.5 rounded-lg border border-bordercolor transition-colors"
                >
                  +45
                </button>
                <button
                  type="button"
                  onclick="addMinutes(60)"
                  class="bg-bglight hover:bg-bordercolor text-primary text-[11px] font-medium px-2 py-0.5 rounded-lg border border-bordercolor transition-colors"
                >
                  +60
                </button>
              </div>
            </div>
            <input
              type="number"
              id="input-duration"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="例如：30"
              class="w-full bg-bglight border border-bordercolor rounded-xl px-3.5 py-2.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-accent/50"
            />
          </div>

          <!-- 備註 -->
          <div>
            <label class="block text-xs font-semibold text-textmuted mb-1"
              >備註 (選填)</label
            >
            <input
              type="text"
              id="input-note"
              placeholder="例如：坡度 6%、平均心率 138"
              class="w-full bg-bglight border border-bordercolor rounded-xl px-3.5 py-2.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-accent/50"
            />
          </div>

          <!-- 送出按鈕 -->
          <button
            onclick="addRecord()"
            class="w-full bg-accent text-white text-xs font-semibold py-3 rounded-xl hover:bg-blue-600 transition-all shadow-sm active:scale-98"
          >
            + 加入累計記錄
          </button>
        </div>

        <!-- 本週明細列表 -->
        <div
          class="bg-cardbg border border-bordercolor rounded-2xl p-5 shadow-sm space-y-3"
        >
          <h3
            class="font-bold text-xs tracking-tight text-textmuted uppercase tracking-wider"
          >
            本週運動明細
          </h3>
          <div id="records-list" class="space-y-2.5">
            <!-- 動態載入記錄 -->
          </div>
        </div>
      </div>

      <!-- 區塊：歷史歸檔 -->
      <div id="section-history" class="space-y-4 hidden">
        <div
          class="bg-cardbg border border-bordercolor rounded-2xl p-5 shadow-sm space-y-4"
        >
          <div class="flex justify-between items-center">
            <h2 class="font-bold text-sm tracking-tight text-primary">
              歷史週紀錄歸檔
            </h2>
            <span id="history-total-weeks" class="text-xs text-textmuted"
              >共 0 週紀錄</span
            >
          </div>
          <div id="history-list" class="space-y-3">
            <!-- 動態載入歷史紀錄 -->
          </div>
        </div>
      </div>
    </main>

    <!-- JavaScript 邏輯 -->
    <script>
      // 資料結構與狀態
      let state = {
        currentDateRange: "2026/10/19 ~ 2026/10/25",
        targetMinutes: 150,
        records: [],
        history: [],
      };

      // 初始化載入 LocalStorage
      function loadData() {
        const saved = localStorage.getItem("cardio_pulse_data");
        if (saved) {
          try {
            state = JSON.parse(saved);
          } catch (e) {
            console.error("載入資料失敗", e);
          }
        }
        render();
      }

      function saveData() {
        localStorage.setItem("cardio_pulse_data", JSON.stringify(state));
      }

      // 快速增加時長
      function addMinutes(mins) {
        const input = document.getElementById("input-duration");
        const current = parseInt(input.value) || 0;
        input.value = current + mins;
      }

      // 新增記錄
      function addRecord() {
        const day = document.getElementById("input-day").value;
        const type = document.getElementById("input-type").value;
        const zone = document.getElementById("input-zone").value;
        const duration = parseInt(
          document.getElementById("input-duration").value,
        );
        const note = document.getElementById("input-note").value.trim();

        if (!day) {
          alert("請選擇星期！");
          return;
        }
        if (!type) {
          alert("請選擇運動種類！");
          return;
        }
        if (!zone) {
          alert("請選擇心率區間！");
          return;
        }
        if (!duration || duration <= 0) {
          alert("請輸入有效的運動分鐘數！");
          return;
        }

        const newRecord = {
          id: Date.now(),
          day,
          type,
          zone,
          duration,
          note,
        };

        state.records.unshift(newRecord);

        // 重置輸入欄位
        document.getElementById("input-day").value = "";
        document.getElementById("input-type").value = "";
        document.getElementById("input-zone").value = "";
        document.getElementById("input-duration").value = "";
        document.getElementById("input-note").value = "";

        saveData();
        render();
      }

      // 刪除記錄
      function deleteRecord(id) {
        state.records = state.records.filter((r) => r.id !== id);
        saveData();
        render();
      }

      // 修改目標
      function editTarget() {
        const newTarget = prompt(
          "請輸入新的每週目標分鐘數：",
          state.targetMinutes,
        );
        if (newTarget !== null) {
          const parsed = parseInt(newTarget);
          if (!isNaN(parsed) && parsed > 0) {
            state.targetMinutes = parsed;
            saveData();
            render();
          } else {
            alert("請輸入有效的數字！");
          }
        }
      }

      // 修改日期區間
      function editDateRange() {
        const newRange = prompt(
          "請輸入本週時間區間（例如：2026/10/26 ~ 2026/11/01）：",
          state.currentDateRange,
        );
        if (newRange !== null && newRange.trim() !== "") {
          state.currentDateRange = newRange.trim();
          saveData();
          render();
        }
      }

      // 開始新的一週 (歸檔)
      function archiveCurrentWeek() {
        if (state.records.length === 0) {
          alert("本週尚無任何運動記錄，無需歸檔！");
          return;
        }

        const totalMins = state.records.reduce((acc, r) => acc + r.duration, 0);

        const archiveItem = {
          id: Date.now(),
          dateRange: state.currentDateRange,
          totalMinutes: totalMins,
          targetMinutes: state.targetMinutes,
          achieved: totalMins >= state.targetMinutes,
          records: [...state.records],
        };

        state.history.unshift(archiveItem);
        state.records = []; // 清空當週記錄

        // 自動推進下週預設日期字串
        state.currentDateRange = "新的一週記錄區間";

        saveData();
        render();
        switchTab("history");
      }

      // 刪除歷史歸檔
      function deleteHistory(id) {
        if (confirm("確定要刪除這筆歷史週紀錄嗎？")) {
          state.history = state.history.filter((h) => h.id !== id);
          saveData();
          render();
        }
      }

      // 頁籤切換
      function switchTab(tab) {
        const currentSec = document.getElementById("section-current");
        const historySec = document.getElementById("section-history");
        const btnCurrent = document.getElementById("tab-current");
        const btnHistory = document.getElementById("tab-history");

        if (tab === "current") {
          currentSec.classList.remove("hidden");
          historySec.classList.add("hidden");
          btnCurrent.className =
            "px-3 py-1.5 rounded-lg bg-white shadow-sm text-primary transition-all";
          btnHistory.className =
            "px-3 py-1.5 rounded-lg text-textmuted transition-all";
        } else {
          currentSec.classList.add("hidden");
          historySec.classList.remove("hidden");
          btnHistory.className =
            "px-3 py-1.5 rounded-lg bg-white shadow-sm text-primary transition-all";
          btnCurrent.className =
            "px-3 py-1.5 rounded-lg text-textmuted transition-all";
        }
      }

      // 畫面渲染
      function render() {
        // 計算總分鐘數
        const totalMins = state.records.reduce((acc, r) => acc + r.duration, 0);
        const totalHours = (totalMins / 60).toFixed(1);

        document.getElementById("total-minutes").innerText = totalMins;
        document.getElementById("total-hours-sub").innerText =
          `(${totalHours} 小時)`;
        document.getElementById("target-display").innerText =
          state.targetMinutes;
        document.getElementById("current-date-range").innerText =
          state.currentDateRange;

        // 進度條與圓形環
        const percent = Math.min(
          Math.round((totalMins / state.targetMinutes) * 100),
          100,
        );
        document.getElementById("progress-percent").innerText = `${percent}%`;
        document.getElementById("progress-bar").style.width = `${percent}%`;

        const circleCircumference = 175.93;
        const strokeOffset =
          circleCircumference - (percent / 100) * circleCircumference;
        document.getElementById("progress-ring").style.strokeDashoffset =
          strokeOffset;

        // 差額提示
        const diff = state.targetMinutes - totalMins;
        const statusEl = document.getElementById("target-status");
        if (diff > 0) {
          statusEl.innerText = `還差 ${diff} 分鐘`;
          statusEl.className = "font-medium text-textmuted";
        } else {
          statusEl.innerText = `已達成每週目標！`;
          statusEl.className = "font-bold text-emerald-600";
        }

        // 心率區間統計
        renderZoneSummary();

        // 渲染本週明細
        const listEl = document.getElementById("records-list");
        if (state.records.length === 0) {
          listEl.innerHTML = `<p class="text-xs text-textmuted text-center py-4">本週還沒有新增運動記錄，趕快開始吧！</p>`;
        } else {
          listEl.innerHTML = state.records
            .map(
              (r) => `
                    <div class="flex justify-between items-center bg-bglight border border-bordercolor/60 rounded-xl px-3.5 py-2.5">
                        <div class="space-y-0.5">
                            <div class="flex items-center space-x-2">
                                <span class="text-xs font-bold text-primary">${r.day}</span>
                                <span class="text-xs font-semibold text-accent bg-blue-50 px-2 py-0.5 rounded-md border border-blue-100">${r.type}</span>
                                <span class="text-[10px] font-medium bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded">${r.zone}</span>
                            </div>
                            ${r.note ? `<p class="text-[11px] text-textmuted">${r.note}</p>` : ""}
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-bold text-primary">${r.duration} 分鐘</span>
                            <button onclick="deleteRecord(${r.id})" class="text-textmuted hover:text-red-500 text-xs px-1.5 py-1 transition-colors">✕</button>
                        </div>
                    </div>
                `,
            )
            .join("");
        }

        // 渲染歷史歸檔
        const historyListEl = document.getElementById("history-list");
        document.getElementById("history-count").innerText =
          state.history.length;
        document.getElementById("history-total-weeks").innerText =
          `共 ${state.history.length} 週紀錄`;

        if (state.history.length === 0) {
          historyListEl.innerHTML = `<p class="text-xs text-textmuted text-center py-6">尚無歷史歸檔記錄。</p>`;
        } else {
          historyListEl.innerHTML = state.history
            .map(
              (h) => `
                    <div class="bg-bglight border border-bordercolor rounded-xl p-4 space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs font-bold text-primary block">${h.dateRange}</span>
                                <span class="text-[11px] text-textmuted">總計：<strong>${h.totalMinutes}</strong> 分鐘 (目標 ${h.targetMinutes}m)</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${h.achieved ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}">
                                    ${h.achieved ? "達標" : "未達標"}
                                </span>
                                <button onclick="deleteHistory(${h.id})" class="text-textmuted hover:text-red-500 text-xs">✕</button>
                            </div>
                        </div>
                        <div class="pt-2 border-t border-bordercolor space-y-1">
                            ${h.records
                              .map(
                                (r) => `
                                <div class="flex justify-between text-[11px] text-textmuted">
                                    <span>${r.day} - ${r.type} (${r.zone})</span>
                                    <span>${r.duration}m</span>
                                </div>
                            `,
                              )
                              .join("")}
                        </div>
                    </div>
                `,
            )
            .join("");
        }
      }

      // 計算心率區間分佈條
      function renderZoneSummary() {
        const zones = {
          "Zone 1": 0,
          "Zone 2": 0,
          "Zone 3": 0,
          "Zone 4": 0,
          "Zone 5": 0,
        };
        let total = 0;
        state.records.forEach((r) => {
          if (zones[r.zone] !== undefined) {
            zones[r.zone] += r.duration;
            total += r.duration;
          }
        });

        const summaryText = document.getElementById("zone-summary-text");
        const miniBars = document.getElementById("zone-mini-bars");

        if (total === 0) {
          summaryText.innerText = "尚無記錄";
          miniBars.innerHTML = `<div class="bg-bordercolor w-full h-full"></div>`;
          return;
        }

        // 尋找佔比最高的主力區間
        let maxZone = "Zone 1";
        let maxMins = 0;
        for (let z in zones) {
          if (zones[z] > maxMins) {
            maxMins = zones[z];
            maxZone = z;
          }
        }
        summaryText.innerText = `主力 ${maxZone} (${maxMins}m)`;

        // 繪製顏色分佈
        const colors = {
          "Zone 1": "bg-slate-400",
          "Zone 2": "bg-blue-400",
          "Zone 3": "bg-emerald-400",
          "Zone 4": "bg-amber-500",
          "Zone 5": "bg-rose-500",
        };

        miniBars.innerHTML = Object.keys(zones)
          .map((z) => {
            const mins = zones[z];
            const pct = total > 0 ? (mins / total) * 100 : 0;
            if (pct === 0) return "";
            return `<div class="${colors[z]} h-full transition-all" style="width: ${pct}%" title="${z}: ${mins}m"></div>`;
          })
          .join("");
      }

      // 啟動
      window.onload = loadData;
    </script>
  </body>
</html>

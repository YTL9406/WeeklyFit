<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Weekly Fit" />
<title>Weekly Fit</title>
<link id="app-favicon" rel="icon" type="image/png" href="" />
<link id="apple-touch-icon" rel="apple-touch-icon" href="" />
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>(function(){var t=null;try{t=localStorage.getItem("WF_THEME")}catch(e){}var d=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.classList.toggle("dark",d)})()</script>
<style>
  body{padding-top:calc(max(env(safe-area-inset-top,0px),47px) + 28px);padding-bottom:max(150px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));-webkit-tap-highlight-color:transparent}
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:calc(max(env(safe-area-inset-top,0px),47px) + 8px);background:#f8fafc;z-index:20;pointer-events:none}
  html.dark body::before{background:#0f172a}
  input,select,textarea{font-size:16px!important;border-radius:.75rem}
  input[type="date"]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;height:46px;box-sizing:border-box;text-align:center}
  input[type="date"]::-webkit-date-and-time-value{text-align:center;margin:0}
  select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px!important}
  .ring{transition:stroke-dashoffset .35s ease-in-out,stroke .3s;transform:rotate(-90deg);transform-origin:50% 50%}
  .sheet{transition:transform .25s ease}.sheet.closed{transform:translateY(100%)}
  details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
  /* 訓練菜單：清單式輸入框 */
  .pi{background:transparent;border:1px solid transparent;color:inherit;transition:background .15s,border-color .15s;outline:none}
  .pi:focus{background:#f8fafc;border-color:#e2e8f0}
  .pi.sm{font-size:14px!important}
  .pr{transition:opacity .2s}
  .pr.done{opacity:.55}
  .pctl{opacity:.3;transition:opacity .15s}
  .pr:focus-within .pctl{opacity:1}
  .tg{display:inline-flex;align-items:center;padding:0 8px;border-radius:9999px;font-size:11px;font-weight:600;line-height:18px;white-space:nowrap;vertical-align:1px;background:#f1f5f9;color:#64748b}
  .tgb{padding:5px 14px;font-size:13px;line-height:20px;border:1px solid #e2e8f0;background:transparent;color:#64748b;transition:background .15s,color .15s,border-color .15s}
  .tgb.on{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
  html.dark .tg{background:#334155;color:#cbd5e1}
  html.dark .tgb{background:transparent;border-color:#475569;color:#94a3b8}
  html.dark .tgb.on{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
  html.dark{color-scheme:dark;background:#0f172a}
  html.dark .pi:focus{background:#0f172a;border-color:#334155}
  .dark .bg-white{background:#1e293b}.dark .bg-white\/95{background:rgba(30,41,59,.95)}
  .dark .bg-slate-50{background:#0f172a}.dark .bg-slate-100{background:#334155}.dark .bg-slate-200{background:#475569}
  .dark .text-slate-900,.dark .text-slate-800{color:#f1f5f9}.dark .text-slate-700{color:#e2e8f0}
  .dark .text-slate-600{color:#cbd5e1}.dark .text-slate-500{color:#94a3b8}
  .dark .border-slate-100,.dark .border-slate-200,.dark .border-slate-200\/70{border-color:#334155}
  .dark .border-white{border-color:#1e293b}
  .dark .bg-sky-50{background:rgba(12,74,110,.45)}.dark .border-sky-100{border-color:#075985}
  .dark .text-sky-600{color:#38bdf8}.dark .text-sky-900{color:#e0f2fe}.dark .text-sky-700{color:#7dd3fc}
  .dark .bg-sky-100{background:#0c4a6e}.dark .bg-sky-300{background:#0284c7}
  .dark .bg-amber-50{background:rgba(69,26,3,.55)}.dark .border-amber-200{border-color:#92400e}.dark .text-amber-800{color:#fcd34d}
  .dark .bg-emerald-100{background:#064e3b}.dark .text-emerald-800{color:#6ee7b7}
  .dark .bg-amber-100{background:#78350f}.dark .bg-orange-100{background:#7c2d12}.dark .text-orange-800{color:#fdba74}
  .dark .bg-rose-100{background:#881337}.dark .text-rose-800{color:#fda4af}
  .dark .ring-slate-800{--tw-ring-color:#e2e8f0}.dark .ring-bg{stroke:#334155}.dark #toast{background:#475569}
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen selection:bg-sky-500 selection:text-white">

<div class="max-w-md mx-auto w-full mb-4">
  <header class="flex items-center justify-between bg-white px-4 py-3 rounded-2xl shadow-sm border border-slate-100">
    <div class="flex items-center gap-3">
      <div id="hico" class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center text-sky-400"><i data-lucide="activity" class="w-6 h-6"></i></div>
      <div><h1 id="ttl" class="text-lg font-bold leading-none">訓練菜單</h1><span id="hd" class="text-xs text-slate-400"></span></div>
    </div>
    <button id="themeBtn" onclick="toggleTheme()" aria-label="切換深色模式" class="p-2.5 rounded-xl bg-slate-100 text-slate-600"></button>
  </header>
</div>

<main class="max-w-md mx-auto w-full">
  <section id="v-plan"></section>
  <section id="v-lib" class="hidden"></section>
  <section id="v-log" class="hidden"></section>
  <section id="v-week" class="hidden"></section>
  <section id="v-cardio" class="hidden space-y-4">
    <div id="seg" class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-xl text-sm font-semibold">
      <button onclick="setSub('current')" data-s="current">本週</button><button onclick="setSub('history')" data-s="history">歷史</button>
    </div>

    <div id="viewCurrent" class="space-y-4">
      <div id="expiredBanner" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-3 text-xs text-amber-800 flex items-center justify-between gap-2">
        <span>本週區間已結束，要結算並開始新的一週嗎？</span>
        <button onclick="archiveCurrentWeek()" class="shrink-0 px-3 py-2 bg-amber-500 text-white rounded-lg font-bold">存檔</button>
      </div>
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-4">
          <span id="displayWeekRange" class="text-sm font-semibold text-slate-600"></span>
          <button onclick="openDateModal()" class="text-xs text-slate-600 bg-slate-100 px-3 py-2 rounded-lg font-medium">編輯日期</button>
        </div>
        <div class="flex items-center justify-between my-2">
          <div>
            <div class="flex items-baseline gap-1.5">
              <span id="displayTotalMinutes" class="text-4xl font-black tracking-tight">0</span>
              <span class="text-sm font-bold text-slate-500">分鐘</span>
              <span id="displayHours" class="text-xs text-slate-400 ml-1"></span>
            </div>
            <div class="mt-2 flex items-center gap-2 text-xs text-slate-500">目標：<strong id="displayTargetMinutes" class="text-slate-800"></strong> 分鐘
              <button onclick="openGoalModal()" class="text-sky-600 bg-sky-50 px-3 py-1.5 rounded font-semibold">編輯</button>
            </div>
          </div>
          <div class="relative w-20 h-20 flex items-center justify-center">
            <svg class="w-20 h-20">
              <circle class="ring-bg" stroke="#f1f5f9" stroke-width="6" fill="transparent" r="32" cx="40" cy="40"/>
              <circle id="progressCircle" class="ring" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" fill="transparent" r="32" cx="40" cy="40"/>
            </svg>
            <span id="displayPercentage" class="absolute text-xs font-black"></span>
          </div>
        </div>
        <div id="statusMessage" class="text-xs font-medium text-slate-500 mb-3"></div>
        <div class="mb-3"><div class="text-[11px] text-slate-400 mb-1">每日分鐘</div><div id="dayStrip" class="grid grid-cols-7 gap-1"></div></div>
        <div class="space-y-2 border-t border-slate-100 pt-3">
          <div class="flex justify-between text-xs"><span class="font-semibold text-slate-600">心率區間分佈</span><span id="zoneText" class="text-slate-400 text-[11px]"></span></div>
          <div id="zoneBar" class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden flex"></div>
          <div id="zoneLegend" class="flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-slate-500"></div>
        </div>
        <div class="mt-4 text-center"><button onclick="archiveCurrentWeek()" class="text-xs text-slate-500 underline py-2 px-3">結算本週並開始新的一週</button></div>
      </div>
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-3">
        <h3 class="text-xs font-bold uppercase tracking-wider flex justify-between"><span>本週明細</span><span id="recordCountTag" class="text-slate-400 font-normal"></span></h3>
        <div id="recordsList" class="space-y-3"></div>
      </div>
    </div>

    <div id="viewHistory" class="space-y-4 hidden">
      <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
        <h2 class="text-sm font-bold mb-1">歷史週紀錄</h2>
        <p id="streakText" class="text-xs text-slate-500 mb-3"></p>
        <div id="historyChart" class="flex items-end gap-1 h-20 mb-4"></div>
        <div id="historyList" class="space-y-3"></div>
      </div>
    </div>
  </section>
</main>

<footer class="max-w-md mx-auto w-full mt-6 text-center text-xs text-slate-400 space-y-1">
  <button onclick="openBk()" class="underline py-1">備份 / 還原</button>
  <p id="backupInfo"></p><p>數據保存在本機裝置</p>
</footer>



<button id="lbtn" onclick="go(tab==='lib'?'plan':'lib')" aria-label="動作庫" class="hidden fixed right-4 z-30 w-12 h-12 rounded-full bg-white border border-slate-200 text-sky-600 shadow-lg items-center justify-center" style="bottom:calc(84px + env(safe-area-inset-bottom))"><i data-lucide="book" class="w-6 h-6"></i></button>
<button id="tbtn" onclick="togglePanel()" aria-label="休息計時器" class="hidden fixed right-4 z-30 h-12 min-w-[3rem] px-3 rounded-full bg-white border border-slate-200 text-sky-600 shadow-lg items-center justify-center" style="bottom:calc(84px + env(safe-area-inset-bottom))"><span id="tbi"><i data-lucide="timer" class="w-6 h-6"></i></span><span id="tbt" class="hidden text-sm font-black tabular-nums"></span></button>
<div id="tpanel" class="hidden fixed right-4 z-40 w-64 bg-white rounded-2xl shadow-xl border border-slate-200 p-4 space-y-3" style="bottom:calc(144px + env(safe-area-inset-bottom))">
  <div class="flex items-center justify-between"><span class="text-xs font-bold text-slate-600">休息計時器</span><button onclick="togglePanel()" class="p-1 text-slate-400" aria-label="收合"><i data-lucide="x" class="w-4 h-4"></i></button></div>
  <div id="tm" class="text-4xl font-black text-center tracking-tight tabular-nums">0:00</div>
  <div class="grid grid-cols-4 gap-1.5"><button data-a="t" data-s="60" class="py-2 rounded-lg bg-slate-100 text-slate-700 text-sm font-semibold">1:00</button><button data-a="t" data-s="90" class="py-2 rounded-lg bg-slate-100 text-slate-700 text-sm font-semibold">1:30</button><button data-a="t" data-s="120" class="py-2 rounded-lg bg-slate-100 text-slate-700 text-sm font-semibold">2:00</button><button data-a="t" data-s="180" class="py-2 rounded-lg bg-slate-100 text-slate-700 text-sm font-semibold">3:00</button></div>
  <div class="flex gap-2"><input id="cs" type="number" inputmode="numeric" placeholder="自訂秒數" class="w-full min-w-0 px-3 py-2 bg-slate-50 border border-slate-200 text-sm"><button data-a="tc" class="shrink-0 px-3 rounded-xl bg-sky-500 text-white text-sm font-bold">開始</button><button data-a="ts" class="shrink-0 px-3 rounded-xl bg-slate-100 text-slate-600 text-sm font-semibold">停止</button></div>
</div>
<nav class="fixed inset-x-0 bottom-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200" style="padding-bottom:env(safe-area-inset-bottom)">
  <div id="nav" class="max-w-md mx-auto grid grid-cols-5 items-center px-2"></div>
</nav>

<!-- 有氧新增 / 編輯 -->
<div id="sheetBg" onclick="closeSheet()" class="fixed inset-0 bg-slate-900/40 z-40 hidden"></div>
<div id="sheet" role="dialog" aria-modal="true" class="sheet closed fixed inset-x-0 bottom-0 z-50 bg-white rounded-t-3xl shadow-2xl max-h-[92vh] overflow-y-auto">
  <form id="recordForm" onsubmit="handleSaveRecord(event)" class="max-w-md mx-auto p-5 space-y-3.5" style="padding-bottom:max(24px,env(safe-area-inset-bottom))">
    <div class="flex justify-between items-center">
      <h2 id="sheetTitle" class="text-sm font-bold"></h2>
      <button type="button" onclick="closeSheet()" class="p-2 text-slate-400" aria-label="關閉"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">日期</label><select id="inDate" required class="w-full pl-3 py-2.5 bg-slate-50 border border-slate-200 text-xs font-medium"></select></div>
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">運動種類</label><select id="inType" required onchange="onTypeChange()" class="w-full pl-3 py-2.5 bg-slate-50 border border-slate-200 text-xs font-medium"></select></div>
    </div>
    <div><label class="block text-xs font-semibold text-slate-600 mb-1">心率區間</label><select id="inZone" required onchange="syncDur()" class="w-full pl-3 py-2.5 bg-slate-50 border border-slate-200 text-xs font-medium"></select></div>
    <div>
      <div class="flex justify-between items-center mb-1.5"><label class="text-xs font-semibold text-slate-600">時長 (分鐘)</label><div id="quickBtns" class="flex gap-1.5"></div></div>
      <input type="number" id="inDur" inputmode="numeric" min="1" max="999" placeholder="例如：40" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 text-xs font-medium" />
    </div>
    <div><label class="block text-xs font-semibold text-slate-600 mb-1">備註 (選填)</label><input type="text" id="inNote" maxlength="100" placeholder="例如：坡度 6%、平均心率 138" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 text-xs font-medium" /></div>
    <button type="submit" id="sheetSubmit" class="w-full py-3.5 bg-sky-500 active:bg-sky-700 text-white font-bold text-sm rounded-xl shadow-md"></button>
  </form>
</div>

<!-- Modals -->
<div id="goalModal" onclick="if(event.target===this)closeGoalModal()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-xl space-y-4">
    <h3 class="text-sm font-bold">修改每週目標分鐘數</h3>
    <input type="number" id="modalGoalInput" inputmode="numeric" min="10" max="2000" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 font-bold" />
    <div class="flex gap-2 justify-end"><button onclick="closeGoalModal()" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold">取消</button><button onclick="saveGoalModal()" class="px-4 py-2 rounded-lg bg-sky-500 text-white text-xs font-bold">確認修改</button></div>
  </div>
</div>
<div id="dateModal" onclick="if(event.target===this)closeDateModal()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-xl space-y-4">
    <h3 class="text-sm font-bold">選擇本週起始日期</h3>
    <input type="date" id="modalStartDateInput" onchange="updateModalRangePreview()" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 font-medium" />
    <div class="bg-sky-50 p-2.5 rounded-xl border border-sky-100 text-xs"><span class="text-sky-600 font-semibold block mb-0.5">自動區間：</span><span id="modalRangePreviewText" class="text-sky-900 font-bold"></span></div>
    <div class="flex gap-2 justify-end"><button onclick="closeDateModal()" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold">取消</button><button onclick="saveDateModal()" class="px-4 py-2 rounded-lg bg-sky-500 text-white text-xs font-bold">確定更新</button></div>
  </div>
</div>
<div id="bkm" onclick="if(event.target===this)this.classList.add('hidden')" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-3">
    <h3 class="text-sm font-bold">備份 / 還原</h3>
    <p class="text-xs text-slate-500">匯出會產生一段文字並複製，請貼到備忘錄保存。還原時把文字貼在下方再按匯入；也可以貼上舊版 Weekly Fit 或訓練日誌的備份內容。</p>
    <textarea id="bk" class="w-full h-32 px-3 py-2.5 bg-slate-50 border border-slate-200 text-xs" placeholder="匯出的文字會顯示在這裡；匯入請貼在這裡"></textarea>
    <p id="bm" class="text-xs text-sky-600"></p>
    <div class="flex gap-2"><button onclick="expBk()" class="flex-1 py-2.5 rounded-lg bg-sky-500 text-white text-xs font-bold">匯出並複製</button><button onclick="impBk()" class="flex-1 py-2.5 rounded-lg bg-slate-100 text-slate-700 text-xs font-semibold">匯入</button><button onclick="$('bkm').classList.add('hidden')" class="flex-1 py-2.5 rounded-lg bg-slate-100 text-slate-700 text-xs font-semibold">關閉</button></div>
  </div>
</div>
<div id="cm" class="fixed inset-0 bg-slate-900/50 z-[70] flex items-center justify-center p-4 hidden">
  <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-xl space-y-4">
    <p id="cmMsg" class="text-sm font-medium"></p>
    <div class="flex gap-2 justify-end"><button onclick="$('cm').classList.add('hidden')" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold">取消</button><button onclick="askOk()" class="px-4 py-2 rounded-lg bg-sky-500 text-white text-xs font-bold">確定</button></div>
  </div>
</div>
<div id="lnkm" onclick="if(event.target===this)closeLink()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-3">
    <h3 class="text-sm font-bold">動作示範連結</h3>
    <p class="text-xs text-slate-500">貼上 YouTube 或其他教學連結，之後在菜單上點動作文字就能直接開啟。</p>
    <input id="lnkIn" type="url" inputmode="url" placeholder="https://youtu.be/..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 text-sm font-medium" />
    <p id="lnkErr" class="text-xs text-rose-500 hidden">連結格式不正確，請貼上完整網址</p>
    <div class="flex gap-2 justify-end"><button id="lnkClr" onclick="clearLink()" class="mr-auto px-4 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold">清除</button><button onclick="closeLink()" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold">取消</button><button onclick="saveLink()" class="px-4 py-2 rounded-lg bg-sky-500 text-white text-xs font-bold">儲存</button></div>
  </div>
</div>
<div id="libm" onclick="if(event.target===this)closePicker()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl space-y-3">
    <div class="flex justify-between items-center"><h3 class="text-sm font-bold">從動作庫加入</h3><button onclick="closePicker()" aria-label="關閉" class="p-1 text-slate-400">✕</button></div>
    <div id="libList" class="max-h-[55vh] overflow-y-auto space-y-3"></div>
    <button id="libAdd" onclick="addFromPicker()" class="w-full py-3 rounded-xl bg-sky-500 text-white text-sm font-bold"></button>
  </div>
</div>
<div id="dtm" onclick="if(event.target===this)closeDayType()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-xl space-y-4">
    <div><h3 id="dtTitle" class="text-sm font-bold"></h3><p class="text-xs text-slate-500 mt-1">可複選；選「休息」會取消其他項目</p></div>
    <div id="dtOpts" class="grid grid-cols-2 gap-2"></div>
    <button id="dtDone" type="button" onclick="toggleDayDone()" class="w-full py-3 rounded-xl border text-sm font-bold"></button>
    <div class="grid grid-cols-2 gap-2">
      <button onclick="dtGo('plan')" class="py-2.5 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold">訓練菜單</button>

/* ============ 訓練（菜單 / 紀錄 / 一週）============ */

let lnkCtx=null;
function normUrl(v){v=(v||"").trim();if(!v)return"";if(!/^https?:\/\//i.test(v)){if(/^[a-z][a-z0-9+.\-]*:/i.test(v))return null;v="https://"+v}try{const u=new URL(v);return /^https?:$/.test(u.protocol)&&u.hostname.includes(".")?u.href:null}catch(e){return null}}

}

const KEY="WEEKLY_FIT_APP_DATA_V3",OLD_KEY="WEEKLY_FIT_APP_DATA_V2";
const ZONES=[
  ["Zone 1","#94a3b8","bg-slate-200 text-slate-700","熱身恢復 / <60% Max HR"],

  ["Zone 4","#f97316","bg-orange-100 text-orange-800","無氧閾值 / 80-90% Max HR"],
  ["Zone 5","#f43f5e","bg-rose-100 text-rose-800","極限爆發 / 90-100% Max HR"]];
const DEFAULT_TYPES=["慢跑 / 超慢跑","快走 / 坡度走","飛輪 / 自行車","橢圓機 / 踏步機","划船機","游泳","重量訓練","羽球","敏捷訓練","其他運動"];
const NONZ=["重量訓練","羽球","敏捷訓練"];

const CIRC=2*Math.PI*32;
let appState={v:3,targetMinutes:200,startDateStr:"",records:[],history:[],types:[...DEFAULT_TYPES],last:{type:DEFAULT_TYPES[0],zone:"Zone 2"},lastBackup:null};
let editingId=null,toastTimer=null;

const sum=r=>r.reduce((t,x)=>t+Number(x.duration),0);
function calcStats(recs){const zones=Object.fromEntries(ZONES.map(z=>[z[0],0]));let total=0;recs.forEach(r=>{if(r.zone in zones){zones[r.zone]+=Number(r.duration);total+=Number(r.duration)}});return{total,zones}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(appState))}catch(e){showToast("儲存失敗（可能是無痕模式或空間已滿）")}}
function sanitize(d){
  const num=(x,def)=>(Number.isFinite(Number(x))&&Number(x)>0?Number(x):def);
  const recs=a=>(Array.isArray(a)?a:[]).filter(r=>r&&typeof r.date==="string"&&(Number(r.duration)>0||r.zone==="無")).map(r=>({id:String(r.id||Date.now()+Math.random()),date:r.date,type:String(r.type||"其他運動"),zone:String(r.zone||"Zone 2"),duration:Number(r.duration)||0,note:String(r.note||"")}));
  const out={...appState};
  out.targetMinutes=num(d.targetMinutes,200);
  out.startDateStr=/^\d{4}-\d{2}-\d{2}$/.test(d.startDateStr)?d.startDateStr:today();
  out.records=recs(d.records);
  out.history=(Array.isArray(d.history)?d.history:[]).filter(h=>h&&h.startDateStr).map(h=>{
    const records=recs(h.records),st=calcStats(records);
    return{...h,endDateStr:h.endDateStr||endOf(h.startDateStr),targetMinutes:num(h.targetMinutes,200),totalMinutes:Number(h.totalMinutes)||0,records,zones:h.zones||(records.length?st.zones:{"Zone 2":Number(h.z2Minutes)||0,"Zone 3":Number(h.z3Minutes)||0}),recordsCount:h.recordsCount??records.length}});
  out.types=Array.isArray(d.types)&&d.types.length?d.types.map(String):[...DEFAULT_TYPES];
  out.last=d.last&&typeof d.last==="object"?d.last:appState.last;
  out.lastBackup=d.lastBackup||null;
  return out;
}
function load(){let raw=null;try{raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY)}catch(e){}
  if(raw){try{appState=sanitize(JSON.parse(raw))}catch(e){}}

  $("historyList").innerHTML=h.map(w=>{
    const zs=ZONES.filter(z=>w.zones&&w.zones[z[0]]).map(z=>`<span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:${z[1]}"></span>Z${z[0].slice(-1)} ${w.zones[z[0]]}</span>`).join("");
    const detail=w.records.length?`<div class="space-y-1 pt-2">${w.records.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(r=>`<div class="flex justify-between text-[11px] text-slate-600"><span>${fmt(r.date).slice(5)} ${esc(r.type)} · ${esc(r.zone)}</span><span class="font-bold">${r.duration>0?r.duration+" 分":""}</span></div>`).join("")}</div>`:`<p class="text-[11px] text-slate-400 pt-2">此週僅保留統計（舊版歸檔）</p>`;
    return`<details class="p-4 bg-slate-50 rounded-2xl border border-slate-200/70"><summary class="cursor-pointer space-y-2"><div class="flex justify-between items-center"><span class="text-xs font-bold">${fmt(w.startDateStr)} ~ ${fmt(w.endDateStr)}</span><span class="text-xs font-black ${w.totalMinutes>=w.targetMinutes?"text-emerald-600":"text-slate-500"}">${w.totalMinutes} / ${w.targetMinutes} 分鐘</span></div>
      <div class="flex flex-wrap gap-x-3 text-[11px] text-slate-500">${zs||"無區間資料"}<span>共 ${w.recordsCount} 筆</span></div></summary>${detail}<div class="text-right pt-2"><button data-act="delhist" data-id="${esc(w.id)}" class="text-[11px] text-rose-500 p-2">刪除此週</button></div></details>`}).join("");
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const id=b.dataset.id;
  if(b.dataset.act==="edit")openSheet(id);
  if(b.dataset.act==="del")deleteRecord(id);
  if(b.dataset.act==="delhist")ask("確定刪除這一週的歷史紀錄？",()=>{appState.history=appState.history.filter(w=>w.id!==id);save();renderApp()});
});

function fillSelects(rec){
  const days=Array.from({length:7},(_,i)=>addDays(appState.startDateStr,i));
  const pref=(tab==="plan"||tab==="log")&&days.includes(wd)?wd:today(),sel=rec?rec.date:days.includes(pref)?pref:days[0];if(!days.includes(sel))days.push(sel);
  $("inDate").innerHTML=days.map(d=>`<option value="${d}" ${d===sel?"selected":""}>${fmt(d)} (${WEEK[parseDate(d).getDay()]})</option>`).join("");
  const type=rec?rec.type:appState.last.type,base=[...new Set([...DEFAULT_TYPES,...appState.types])],types=base.includes(type)?base:[...base,type];
  $("inType").innerHTML=types.map(t=>`<option value="${esc(t)}" ${t===type?"selected":""}>${esc(t)}</option>`).join("");
  const zone=rec?rec.zone:appState.last.zone;
  $("inZone").innerHTML=ZONES.map(z=>`<option value="${z[0]}" ${z[0]===zone?"selected":""}>${z[0]} (${z[3]})</option>`).join("")+`<option value="無" ${zone==="無"?"selected":""}>無（不計入有氧時數）</option>`;
}
function openSheet(id){
  const rec=id?appState.records.find(r=>r.id===id):null;editingId=rec?rec.id:null;
  
  fillSelects(rec);syncDur();
  $("inDur").value=rec?rec.duration:"";$("inNote").value=rec?rec.note:"";
  $("sheetTitle").textContent=rec?"編輯運動紀錄":"新增運動紀錄";$("sheetSubmit").textContent=rec?"儲存修改":"加入運動紀錄";
  $("quickBtns").innerHTML=[5,10,15,30,60].map(n=>`<button type="button" onclick="addMinutesQuick(${n})" class="px-2.5 py-1.5 text-xs bg-slate-100 text-slate-700 font-semibold rounded-md border border-slate-200">+${n}</button>`).join("")+`<button type="button" onclick="$('inDur').value=''" class="px-2.5 py-1.5 text-xs text-slate-400">清除</button>`;
  $("sheetBg").classList.remove("hidden");$("sheet").classList.remove("closed");
  setTimeout(()=>$("inDur").focus(),260);
}
function syncDur(){const none=$("inZone").value==="無";$("inDur").required=!none;$("inDur").placeholder=none?"選填":"例如：40"}
function onTypeChange(){if(NONZ.includes($("inType").value))$("inZone").value="無";syncDur()}
function refresh(){renderApp();if(tab!=="cardio")render()}
function closeSheet(){$("sheet").classList.add("closed");$("sheetBg").classList.add("hidden");editingId=null}
function addMinutesQuick(n){$("inDur").value=(parseInt($("inDur").value,10)||0)+n}
function handleSaveRecord(e){
  e.preventDefault();const duration=parseInt($("inDur").value,10)||0;if($("inZone").value!=="無"&&duration<=0)return;
  const data={date:$("inDate").value,type:$("inType").value,zone:$("inZone").value,duration,note:$("inNote").value.trim()};
  if(editingId){Object.assign(appState.records.find(x=>x.id===editingId),data);showToast("已更新紀錄")}
  else{appState.records.push({id:Date.now().toString(),...data});showToast("已新增紀錄")}
  appState.last={type:data.type,zone:data.zone};save();refresh();closeSheet();
}
function deleteRecord(id){
  const idx=appState.records.findIndex(r=>r.id===id);if(idx<0)return;
  const[removed]=appState.records.splice(idx,1);save();renderApp();
  showToast("已刪除紀錄",()=>{appState.records.splice(idx,0,removed);save();renderApp()});
}
function archiveCurrentWeek(){
  ask("確定要存檔並開始新的一週嗎？",()=>{
    const{total,zones}=calcStats(appState.records),end=endOf(appState.startDateStr);
    appState.history.unshift({id:Date.now().toString(),startDateStr:appState.startDateStr,endDateStr:end,targetMinutes:appState.targetMinutes,totalMinutes:total,zones,records:appState.records,recordsCount:appState.records.length,archivedAt:new Date().toISOString()});
    appState.startDateStr=addDays(end,1);appState.records=[];save();renderApp();
  });
}
function openGoalModal(){$("modalGoalInput").value=appState.targetMinutes;$("goalModal").classList.remove("hidden")}
function closeGoalModal(){$("goalModal").classList.add("hidden")}
function saveGoalModal(){const v=parseInt($("modalGoalInput").value,10);if(v>0){appState.targetMinutes=v;save();renderApp();closeGoalModal()}}
function openDateModal(){$("modalStartDateInput").value=appState.startDateStr;updateModalRangePreview();$("dateModal").classList.remove("hidden")}
function closeDateModal(){$("dateModal").classList.add("hidden")}
function updateModalRangePreview(){const s=$("modalStartDateInput").value;if(s)$("modalRangePreviewText").textContent=`${fmt(s)} ~ ${fmt(endOf(s))}`}
function saveDateModal(){const s=$("modalStartDateInput").value;if(s){appState.startDateStr=s;save();renderApp();closeDateModal()}}

/* ============ 分頁 / 主題 / 備份 ============ */
const TABS=[["plan","訓練菜單","list"],["log","訓練紀錄","chart"],["week","一週紀錄","cal"],["cardio","有氧時數","activity"],["lib","動作庫","book"]];
function updFab(){}
function setSub(s){
  sub=s;$("viewCurrent").classList.toggle("hidden",s!=="current");$("viewHistory").classList.toggle("hidden",s!=="history");
  document.querySelectorAll("#seg button").forEach(b=>b.className=b.dataset.s===s?"py-2 rounded-lg bg-white shadow-sm text-slate-800":"py-2 text-slate-500");
  updFab();
}
function go(t){
  tab=t;TABS.forEach(x=>$("v-"+x[0]).classList.toggle("hidden",x[0]!==t));
  const nb=x=>`<button onclick="go('${x[0]}')" class="flex flex-col items-center gap-1 py-2.5 text-[11px] font-semibold ${x[0]===t?"text-sky-500":"text-slate-400"}"><i data-lucide="${x[2]}" class="w-6 h-6"></i>${x[1]}</button>`;
  $("nav").innerHTML=nb(TABS[0])+nb(TABS[1])+`<button onclick="openSheet()" aria-label="新增運動紀錄" class="mx-auto -mt-6 w-14 h-14 rounded-full bg-sky-500 active:bg-sky-700 text-white shadow-lg shadow-sky-300/50 flex items-center justify-center border-4 border-white"><i data-lucide="plus" class="w-7 h-7"></i></button>`+nb(TABS[2])+nb(TABS[3]);
  $("hico").innerHTML=`<i data-lucide="${TABS.find(x=>x[0]===t)[2]}" class="w-6 h-6"></i>`;
  $("ttl").textContent=TABS.find(x=>x[0]===t)[1];
  if(t==="cardio"){setSub(sub);renderApp()}else render();
  const lv=t==="plan"||t==="lib",la=t==="lib",lb=$("lbtn");lb.classList.toggle("hidden",!lv);lb.classList.toggle("flex",lv);["!bg-sky-500","!text-white","!border-sky-500"].forEach(c=>lb.classList.toggle(c,la));const on=t==="log";$("tbtn").classList.toggle("hidden",!on);$("tbtn").classList.toggle("flex",on);lucide.createIcons();window.scrollTo({top:0});
}
function updateThemeBtn(){$("themeBtn").innerHTML=`<i data-lucide="${document.documentElement.classList.contains("dark")?"sun":"moon"}" class="w-5 h-5"></i>`}
function toggleTheme(){const d=document.documentElement.classList.toggle("dark");try{localStorage.setItem("WF_THEME",d?"dark":"light")}catch(e){}updateThemeBtn();lucide.createIcons()}
function openBk(){$("bk").value="";$("bm").textContent="";$("bkm").classList.remove("hidden")}
function expBk(){
  appState.lastBackup=today();save();const t=$("bk");t.value=JSON.stringify({wk:W,wf:appState,lib:LIB});t.focus();t.select();
  try{document.execCommand("copy")}catch(e){}try{navigator.clipboard&&navigator.clipboard.writeText(t.value)}catch(e){}
  $("bm").textContent="已匯出。若沒有自動複製，請長按文字框選「全選」再複製，貼到備忘錄保存。";
  if(tab==="cardio")renderApp();
}
function impBk(){
  let o;try{o=JSON.parse($("bk").value)}catch(e){$("bm").textContent="格式不正確，請貼上完整的匯出文字";return}
  if(!o||typeof o!=="object"||Array.isArray(o)){$("bm").textContent="格式不正確，請貼上完整的匯出文字";return}
  let wk=null,wf=null;if(o.wk||o.wf){wk=o.wk;wf=o.wf}else if(Array.isArray(o.records))wf=o;else wk=o;
  ask("匯入會覆蓋相同日期的訓練資料，以及目前的有氧資料。確定嗎？",()=>{
    if(wk&&typeof wk==="object"){Object.assign(W,wk);Object.values(W).forEach(x=>{(x.logs||[]).forEach(mig);migPlan(x)});saveW()}
    if(wf&&Array.isArray(wf.records)){appState=sanitize(wf);save()}
    if(Array.isArray(o.lib)){o.lib.forEach(x=>{if(x&&typeof x.t==="string"&&!LIB.some(y=>y.id===x.id||(y.c===(x.c||"")&&y.t===x.t)))LIB.push({id:String(x.id||Date.now()+Math.random()),c:String(x.c||""),t:x.t,u:String(x.u||"")})});saveLib()}
    go(tab);$("bm").textContent="匯入完成";
  });
}
function generateAppIcons(){
  const cv=document.createElement("canvas");cv.width=cv.height=180;const ctx=cv.getContext("2d");
  ctx.fillStyle="#0f172a";ctx.beginPath();ctx.roundRect?ctx.roundRect(0,0,180,180,40):ctx.rect(0,0,180,180);ctx.fill();
  ctx.strokeStyle="#38bdf8";ctx.lineWidth=12;ctx.lineCap=ctx.lineJoin="round";ctx.beginPath();
  [[25,90],[55,90],[75,45],[95,135],[115,70],[130,90],[155,90]].forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
  const u=cv.toDataURL("image/png");$("apple-touch-icon").href=u;$("app-favicon").href=u;
}
window.addEventListener("DOMContentLoaded",()=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}generateAppIcons();loadW();loadLib();load();updateThemeBtn();go("plan")});
</script>

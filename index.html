<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Weekly Fit" />
<title>Weekly Fit - 週運動目標追蹤</title>
<link id="app-favicon" rel="icon" type="image/png" href="" />
<link id="apple-touch-icon" rel="apple-touch-icon" href="" />
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>(function(){var t=null;try{t=localStorage.getItem("WF_THEME")}catch(e){}var d=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.classList.toggle("dark",d)})()</script>
<style>
  body{padding-top:max(16px,calc(env(safe-area-inset-top) + 14px));padding-bottom:max(110px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));-webkit-tap-highlight-color:transparent}
  input,select{font-size:16px!important;border-radius:.75rem}
  select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px!important}
  .ring{transition:stroke-dashoffset .35s ease-in-out,stroke .3s;transform:rotate(-90deg);transform-origin:50% 50%}
  .sheet{transition:transform .25s ease}
  .sheet.closed{transform:translateY(100%)}
  details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}

  html.dark{color-scheme:dark;background:#0f172a}
  .dark .bg-white{background:#1e293b}.dark .bg-white\/95{background:rgba(30,41,59,.95)}
  .dark .bg-slate-50{background:#0f172a}.dark .bg-slate-100{background:#334155}.dark .bg-slate-200{background:#475569}
  .dark .text-slate-900,.dark .text-slate-800{color:#f1f5f9}.dark .text-slate-700{color:#e2e8f0}
  .dark .text-slate-600{color:#cbd5e1}.dark .text-slate-500{color:#94a3b8}
  .dark .border-slate-100,.dark .border-slate-200,.dark .border-slate-200\/70{border-color:#334155}
  .dark .border-white{border-color:#1e293b}
  .dark .bg-sky-50{background:rgba(12,74,110,.45)}.dark .border-sky-100{border-color:#075985}
  .dark .text-sky-600{color:#38bdf8}.dark .text-sky-900{color:#e0f2fe}.dark .text-sky-700{color:#7dd3fc}
  .dark .bg-sky-100{background:#0c4a6e}.dark .bg-sky-300{background:#0284c7}
  .dark .bg-amber-50{background:rgba(69,26,3,.55)}.dark .border-amber-200{border-color:#92400e}.dark .text-amber-800{color:#fcd34d}
  .dark .bg-emerald-100{background:#064e3b}.dark .text-emerald-800{color:#6ee7b7}
  .dark .bg-amber-100{background:#78350f}.dark .bg-orange-100{background:#7c2d12}.dark .text-orange-800{color:#fdba74}
  .dark .bg-rose-100{background:#881337}.dark .text-rose-800{color:#fda4af}
  .dark .ring-slate-800{--tw-ring-color:#e2e8f0}.dark .ring-bg{stroke:#334155}.dark #toast{background:#475569}
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen selection:bg-sky-500 selection:text-white">

<div class="max-w-md mx-auto w-full mb-4">
  <header class="flex items-center justify-between bg-white px-4 py-3 rounded-2xl shadow-sm border border-slate-100">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center text-sky-400"><i data-lucide="activity" class="w-6 h-6"></i></div>
      <div><h1 class="text-lg font-bold leading-none">Weekly Fit</h1><span class="text-xs text-slate-400">離線自動儲存</span></div>
    </div>
    <button id="themeBtn" onclick="toggleTheme()" aria-label="切換深色模式" class="p-2.5 rounded-xl bg-slate-100 text-slate-600"></button>
  </header>
</div>

<main class="max-w-md mx-auto w-full flex flex-col gap-4">
  <div id="viewCurrent" class="space-y-4">
    <div id="expiredBanner" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-3 text-xs text-amber-800 flex items-center justify-between gap-2">
      <span>本週區間已結束，要結算並開始新的一週嗎？</span>
      <button onclick="archiveCurrentWeek()" class="shrink-0 px-3 py-2 bg-amber-500 text-white rounded-lg font-bold">存檔</button>
    </div>

    <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <span id="displayWeekRange" class="text-sm font-semibold text-slate-600"></span>
        <button onclick="openDateModal()" class="text-xs text-slate-600 bg-slate-100 px-3 py-2 rounded-lg font-medium">編輯日期</button>
      </div>
      <div class="flex items-center justify-between my-2">
        <div>
          <div class="flex items-baseline gap-1.5">
            <span id="displayTotalMinutes" class="text-4xl font-black tracking-tight">0</span>
            <span class="text-sm font-bold text-slate-500">分鐘</span>
            <span id="displayHours" class="text-xs text-slate-400 ml-1"></span>
          </div>
          <div class="mt-2 flex items-center gap-2 text-xs text-slate-500">目標：<strong id="displayTargetMinutes" class="text-slate-800"></strong> 分鐘
            <button onclick="openGoalModal()" class="text-sky-600 bg-sky-50 px-3 py-1.5 rounded font-semibold">編輯</button>
          </div>
        </div>
        <div class="relative w-20 h-20 flex items-center justify-center">
          <svg class="w-20 h-20">
            <circle class="ring-bg" stroke="#f1f5f9" stroke-width="6" fill="transparent" r="32" cx="40" cy="40"/>
            <circle id="progressCircle" class="ring" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" fill="transparent" r="32" cx="40" cy="40"/>
          </svg>
          <span id="displayPercentage" class="absolute text-xs font-black"></span>
        </div>
      </div>
      <div id="statusMessage" class="text-xs font-medium text-slate-500 mb-3"></div>

      <div class="mb-3">
        <div class="text-[11px] text-slate-400 mb-1">每日分鐘</div>
        <div id="dayStrip" class="grid grid-cols-7 gap-1"></div>
      </div>

      <div class="space-y-2 border-t border-slate-100 pt-3">
        <div class="flex justify-between text-xs"><span class="font-semibold text-slate-600">心率區間分佈</span><span id="zoneText" class="text-slate-400 text-[11px]"></span></div>
        <div id="zoneBar" class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden flex"></div>
        <div id="zoneLegend" class="flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-slate-500"></div>
      </div>
      <div class="mt-4 text-center">
        <button onclick="archiveCurrentWeek()" class="text-xs text-slate-500 underline py-2 px-3">結算本週並開始新的一週</button>
      </div>
    </div>

    <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-3">
      <h3 class="text-xs font-bold uppercase tracking-wider flex justify-between"><span>本週明細</span><span id="recordCountTag" class="text-slate-400 font-normal"></span></h3>
      <div id="recordsList" class="space-y-3"></div>
    </div>
  </div>

  <div id="viewHistory" class="space-y-4 hidden">
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
      <h2 class="text-sm font-bold mb-1 flex items-center gap-2"><i data-lucide="history" class="w-4 h-4 text-sky-500"></i>歷史週紀錄</h2>
      <p id="streakText" class="text-xs text-slate-500 mb-3"></p>
      <div id="historyChart" class="flex items-end gap-1 h-20 mb-4"></div>
      <div id="historyList" class="space-y-3"></div>
    </div>
  </div>
</main>

<footer class="max-w-md mx-auto w-full mt-6 text-center text-xs text-slate-400 space-y-2">
  <div class="flex items-center justify-center gap-3">
    <button onclick="exportDataJSON()" class="underline py-1">匯出備份</button><span>•</span>
    <label class="underline cursor-pointer py-1">匯入備份<input type="file" id="importFileInput" accept=".json" onchange="importDataJSON(event)" class="hidden" /></label>
  </div>
  <p id="backupInfo"></p>
  <p>© Weekly Fit • 數據保存在本機裝置</p>
</footer>

<!-- FAB -->
<nav class="fixed inset-x-0 bottom-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200" style="padding-bottom:env(safe-area-inset-bottom)">
  <div class="max-w-md mx-auto grid grid-cols-3 items-center px-4">
    <button id="navCurrent" onclick="switchTab('current')"><i data-lucide="calendar-check" class="w-6 h-6"></i>本週</button>
    <button onclick="openSheet()" aria-label="新增運動紀錄" class="mx-auto -mt-6 w-14 h-14 rounded-full bg-sky-500 active:bg-sky-700 text-white shadow-lg shadow-sky-300/50 flex items-center justify-center border-4 border-white"><i data-lucide="plus" class="w-7 h-7"></i></button>
    <button id="navHistory" onclick="switchTab('history')"><span class="relative"><i data-lucide="history" class="w-6 h-6"></i><span id="historyBadge" class="absolute -top-1 -right-4 px-1.5 bg-slate-200 text-slate-600 rounded-full text-[10px]">0</span></span>歷史</button>
  </div>
</nav>

<!-- Add / Edit bottom sheet -->
<div id="sheetBg" onclick="closeSheet()" class="fixed inset-0 bg-slate-900/40 z-40 hidden"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" class="sheet closed fixed inset-x-0 bottom-0 z-50 bg-white rounded-t-3xl shadow-2xl max-h-[92vh] overflow-y-auto">
  <form id="recordForm" onsubmit="handleSaveRecord(event)" class="max-w-md mx-auto p-5 space-y-3.5" style="padding-bottom:max(24px,env(safe-area-inset-bottom))">
    <div class="flex justify-between items-center">
      <h2 id="sheetTitle" class="text-sm font-bold"></h2>
      <button type="button" onclick="closeSheet()" class="p-2 text-slate-400" aria-label="關閉"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">日期</label>
        <select id="inDate" required class="w-full pl-3 py-2.5 bg-slate-50 border border-slate-200 text-xs font-medium"></select></div>
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">運動種類</label>
        <select id="inType" required onchange="onTypeChange()" class="w-full pl-3 py-2.5 bg-slate-50 border border-slate-200 text-xs font-medium"></select></div>
    </div>
    <div><label class="block text-xs font-semibold text-slate-600 mb-1">心率區間</label>
      <select id="inZone" required class="w-full pl-3 py-2.5 bg-slate-50 border border-slate-200 text-xs font-medium"></select></div>
    <div>
      <div class="flex justify-between items-center mb-1.5">
        <label class="text-xs font-semibold text-slate-600">時長 (分鐘)</label>
        <div id="quickBtns" class="flex gap-1.5"></div>
      </div>
      <input type="number" id="inDur" inputmode="numeric" min="1" max="999" placeholder="例如：40" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 text-xs font-medium" />
    </div>
    <div><label class="block text-xs font-semibold text-slate-600 mb-1">備註 (選填)</label>
      <input type="text" id="inNote" maxlength="100" placeholder="例如：坡度 6%、平均心率 138" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 text-xs font-medium" /></div>
    <button type="submit" id="sheetSubmit" class="w-full py-3.5 bg-sky-500 active:bg-sky-700 text-white font-bold text-sm rounded-xl shadow-md"></button>
  </form>
</div>

<!-- Modals -->
<div id="goalModal" role="dialog" aria-modal="true" onclick="if(event.target===this)closeGoalModal()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-xl space-y-4">
    <h3 class="text-sm font-bold">修改每週目標分鐘數</h3>
    <input type="number" id="modalGoalInput" inputmode="numeric" min="10" max="2000" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 font-bold" />
    <div class="flex gap-2 justify-end">
      <button onclick="closeGoalModal()" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold">取消</button>
      <button onclick="saveGoalModal()" class="px-4 py-2 rounded-lg bg-sky-500 text-white text-xs font-bold">確認修改</button>
    </div>
  </div>
</div>
<div id="dateModal" role="dialog" aria-modal="true" onclick="if(event.target===this)closeDateModal()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-xl space-y-4">
    <h3 class="text-sm font-bold">選擇本週起始日期</h3>
    <input type="date" id="modalStartDateInput" onchange="updateModalRangePreview()" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 text-xs font-medium" />
    <div class="bg-sky-50 p-2.5 rounded-xl border border-sky-100 text-xs"><span class="text-sky-600 font-semibold block mb-0.5">自動區間：</span><span id="modalRangePreviewText" class="text-sky-900 font-bold"></span></div>
    <div class="flex gap-2 justify-end">
      <button onclick="closeDateModal()" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-semibold">取消</button>
      <button onclick="saveDateModal()" class="px-4 py-2 rounded-lg bg-sky-500 text-white text-xs font-bold">確定更新</button>
    </div>
  </div>
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[60] hidden bg-slate-900 text-white text-xs rounded-xl px-4 py-3 shadow-lg items-center gap-3" style="bottom:calc(84px + env(safe-area-inset-bottom))"></div>

<script>
/* 內嵌圖示（不依賴外部圖示庫） */
const ICONS = {
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  pencil: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>',
  "trash-2": '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  "calendar-check": '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>',
  history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
};
const lucide = {
  createIcons() {
    document.querySelectorAll("[data-lucide]").forEach((el) => {
      const p = ICONS[el.dataset.lucide]; if (!p) return;
      const w = document.createElement("span");
      w.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
      const svg = w.firstChild; svg.setAttribute("class", el.getAttribute("class") || "");
      el.replaceWith(svg);
    });
  },
};
const KEY = "WEEKLY_FIT_APP_DATA_V3", OLD_KEY = "WEEKLY_FIT_APP_DATA_V2";
const ZONES = [
  ["Zone 1", "#94a3b8", "bg-slate-200 text-slate-700", "熱身恢復 / <60% Max HR"],
  ["Zone 2", "#10b981", "bg-emerald-100 text-emerald-800", "最佳燃脂 / 60-70% Max HR"],
  ["Zone 3", "#f59e0b", "bg-amber-100 text-amber-800", "有氧耐力 / 70-80% Max HR"],
  ["Zone 4", "#f97316", "bg-orange-100 text-orange-800", "無氧閾值 / 80-90% Max HR"],
  ["Zone 5", "#f43f5e", "bg-rose-100 text-rose-800", "極限爆發 / 90-100% Max HR"],
];
const DEFAULT_TYPES = ["慢跑 / 超慢跑","快走 / 坡度走","飛輪 / 自行車","橢圓機 / 踏步機","划船機","游泳","重量訓練","其他運動"];
const WEEK = ["日","一","二","三","四","五","六"];
const CIRC = 2 * Math.PI * 32;

let appState = { v: 3, targetMinutes: 200, startDateStr: "", records: [], history: [], types: [...DEFAULT_TYPES], last: { type: DEFAULT_TYPES[0], zone: "Zone 2" }, lastBackup: null };
let editingId = null, toastTimer = null;

/* ---------- 工具函式 ---------- */
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }; // 本地時間，避免時區偏移
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return toDateStr(d); };
const today = () => toDateStr(new Date());
const fmt = (s) => s.replace(/-/g, "/");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const endOf = (s) => addDays(s, 6);
const zoneInfo = (z) => ZONES.find((x) => x[0] === z) || ZONES[0];
const sum = (recs) => recs.reduce((t, r) => t + Number(r.duration), 0);
function calcStats(recs) {
  const zones = Object.fromEntries(ZONES.map((z) => [z[0], 0]));
  recs.forEach((r) => { if (r.zone in zones) zones[r.zone] += Number(r.duration); });
  return { total: sum(recs), zones };
}

/* ---------- 儲存 ---------- */
function save() { try { localStorage.setItem(KEY, JSON.stringify(appState)); } catch (e) { showToast("⚠️ 儲存失敗（可能是無痕模式或空間已滿）"); } }
function sanitize(d) {
  const num = (x, def) => (Number.isFinite(Number(x)) && Number(x) > 0 ? Number(x) : def);
  const recs = (a) => (Array.isArray(a) ? a : []).filter((r) => r && typeof r.date === "string" && Number(r.duration) > 0)
    .map((r) => ({ id: String(r.id || Date.now() + Math.random()), date: r.date, type: String(r.type || "其他運動"), zone: String(r.zone || "Zone 2"), duration: Number(r.duration), note: String(r.note || "") }));
  const out = { ...appState };
  out.targetMinutes = num(d.targetMinutes, 200);
  out.startDateStr = /^\d{4}-\d{2}-\d{2}$/.test(d.startDateStr) ? d.startDateStr : today();
  out.records = recs(d.records);
  out.history = (Array.isArray(d.history) ? d.history : []).filter((h) => h && h.startDateStr).map((h) => {
    const records = recs(h.records), st = calcStats(records);
    return { ...h, endDateStr: h.endDateStr || endOf(h.startDateStr), targetMinutes: num(h.targetMinutes, 200), totalMinutes: Number(h.totalMinutes) || 0, records,
      zones: h.zones || (records.length ? st.zones : { "Zone 2": Number(h.z2Minutes) || 0, "Zone 3": Number(h.z3Minutes) || 0 }), recordsCount: h.recordsCount ?? records.length };
  });
  out.types = Array.isArray(d.types) && d.types.length ? d.types.map(String) : [...DEFAULT_TYPES];
  out.last = d.last && typeof d.last === "object" ? d.last : appState.last;
  out.lastBackup = d.lastBackup || null;
  return out;
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY); } catch (e) {}
  if (raw) { try { appState = sanitize(JSON.parse(raw)); } catch (e) {} }
  if (!appState.startDateStr) appState.startDateStr = today();
}

/* ---------- Toast ---------- */
function showToast(msg, undoFn) {
  const t = $("toast");
  t.innerHTML = `<span>${esc(msg)}</span>` + (undoFn ? `<button id="undoBtn" class="font-bold text-sky-300 px-2 py-1">復原</button>` : "");
  t.classList.remove("hidden"); t.classList.add("flex");
  if (undoFn) $("undoBtn").onclick = () => { undoFn(); hideToast(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() { $("toast").classList.add("hidden"); $("toast").classList.remove("flex"); }

/* ---------- 渲染 ---------- */
function renderApp() {
  const start = appState.startDateStr, end = endOf(start), target = appState.targetMinutes;
  const { total, zones } = calcStats(appState.records);
  $("displayWeekRange").textContent = `${fmt(start)} ~ ${fmt(end)}`;
  $("displayTotalMinutes").textContent = total;
  $("displayHours").textContent = `(${(total / 60).toFixed(1)} 小時)`;
  $("displayTargetMinutes").textContent = target;
  $("displayPercentage").textContent = `${Math.min(Math.round((total / target) * 100), 999)}%`;
  $("expiredBanner").classList.toggle("hidden", today() <= end);

  const remaining = target - total;
  $("statusMessage").innerHTML = remaining > 0
    ? `還差 <span class="text-slate-800 font-bold">${remaining}</span> 分鐘達標`
    : `<span class="text-emerald-600 font-bold">🎉 太棒了！已達成每週運動目標！</span>`;
  const c = $("progressCircle");
  c.style.strokeDasharray = `${CIRC} ${CIRC}`;
  c.style.strokeDashoffset = CIRC - Math.min(total / target, 1) * CIRC;
  c.style.stroke = remaining <= 0 ? "#10b981" : "#0ea5e9";

  // 每日色塊
  const byDay = {}; appState.records.forEach((r) => (byDay[r.date] = (byDay[r.date] || 0) + Number(r.duration)));
  $("dayStrip").innerHTML = Array.from({ length: 7 }, (_, i) => {
    const ds = addDays(start, i), m = byDay[ds] || 0, isT = ds === today();
    const cls = m === 0 ? "bg-slate-100 text-slate-400" : m < 30 ? "bg-sky-100 text-sky-700" : m < 60 ? "bg-sky-300 text-sky-900" : "bg-sky-500 text-white";
    return `<div class="rounded-lg py-1.5 text-center ${cls} ${isT ? "ring-2 ring-slate-800" : ""}"><div class="text-[10px]">${WEEK[parseDate(ds).getDay()]}</div><div class="text-[11px] font-bold">${m || "-"}</div></div>`;
  }).join("");

  // Zone 分佈
  $("zoneBar").innerHTML = ZONES.map((z) => `<div class="h-full transition-all duration-300" style="width:${total ? (zones[z[0]] / total) * 100 : 0}%;background:${z[1]}"></div>`).join("");
  $("zoneLegend").innerHTML = ZONES.map((z) => `<span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:${z[1]}"></span>Z${z[0].slice(-1)} ${zones[z[0]]}分</span>`).join("");
  $("zoneText").textContent = total ? "" : "尚無紀錄";

  renderRecords(); renderHistory();
  $("historyBadge").textContent = appState.history.length;
  const lb = appState.lastBackup;
  $("backupInfo").textContent = lb ? `上次備份：${fmt(lb)}${(parseDate(today()) - parseDate(lb)) / 864e5 > 14 ? "（已超過 14 天，建議備份）" : ""}` : "尚未備份過";
  lucide.createIcons();
}

function recordRow(r) {
  const zi = zoneInfo(r.zone);
  return `<div class="p-3 bg-slate-50 rounded-2xl flex items-center justify-between border border-slate-100">
    <div class="min-w-0 space-y-1">
      <div class="flex items-center gap-2 flex-wrap"><span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${zi[2]}">${esc(r.zone)}</span><span class="text-sm font-semibold text-slate-700">${esc(r.type)}</span></div>
      ${r.note ? `<p class="text-xs text-slate-400 break-words">${esc(r.note)}</p>` : ""}
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <span class="text-base font-black mr-1">${r.duration}<span class="text-[10px] font-normal text-slate-500"> 分</span></span>
      <button data-act="edit" data-id="${esc(r.id)}" class="text-slate-400 hover:text-sky-500 p-2.5" aria-label="編輯"><i data-lucide="pencil" class="w-4 h-4"></i></button>
      <button data-act="del" data-id="${esc(r.id)}" class="text-slate-300 hover:text-rose-500 p-2.5" aria-label="刪除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div></div>`;
}
function renderRecords() {
  const recs = appState.records;
  $("recordCountTag").textContent = `${recs.length} 筆`;
  if (!recs.length) { $("recordsList").innerHTML = `<div class="py-8 text-center text-slate-400 text-xs bg-slate-50 rounded-2xl border border-dashed border-slate-200">本週尚無運動紀錄<br>點擊右下角 + 新增第一筆吧！</div>`; return; }
  const groups = {}; recs.forEach((r) => (groups[r.date] = groups[r.date] || []).push(r));
  $("recordsList").innerHTML = Object.keys(groups).sort().reverse().map((d) => {
    const items = groups[d].slice().reverse();
    return `<div class="space-y-2"><div class="flex justify-between text-xs font-bold text-slate-600 px-1"><span>${fmt(d)} (${WEEK[parseDate(d).getDay()]})${d === today() ? " · 今天" : ""}</span><span>${sum(items)} 分鐘</span></div>${items.map(recordRow).join("")}</div>`;
  }).join("");
}

function renderHistory() {
  const h = appState.history;
  let streak = 0; for (const w of h) { if (w.totalMinutes >= w.targetMinutes) streak++; else break; }
  $("streakText").textContent = h.length ? `🔥 連續達標 ${streak} 週 · 共 ${h.length} 週紀錄` : "點擊「結算本週」後，週紀錄會保存在這裡。";
  const recent = h.slice(0, 8).reverse(), max = Math.max(1, ...recent.map((w) => Math.max(w.totalMinutes, w.targetMinutes)));
  $("historyChart").innerHTML = recent.map((w) => `<div class="flex-1 flex flex-col justify-end h-full" title="${fmt(w.startDateStr)}"><div class="rounded-t ${w.totalMinutes >= w.targetMinutes ? "bg-emerald-500" : "bg-slate-300"}" style="height:${(w.totalMinutes / max) * 100}%"></div></div>`).join("");
  if (!h.length) { $("historyList").innerHTML = `<div class="py-10 text-center text-slate-400 text-xs bg-slate-50 rounded-2xl border border-dashed border-slate-200">尚無歷史歸檔紀錄</div>`; return; }
  $("historyList").innerHTML = h.map((w) => {
    const zs = ZONES.filter((z) => w.zones && w.zones[z[0]]).map((z) => `<span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full" style="background:${z[1]}"></span>Z${z[0].slice(-1)} ${w.zones[z[0]]}</span>`).join("");
    const detail = w.records.length ? `<div class="space-y-1 pt-2">${w.records.slice().sort((a, b) => a.date.localeCompare(b.date)).map((r) => `<div class="flex justify-between text-[11px] text-slate-600"><span>${fmt(r.date).slice(5)} ${esc(r.type)} · ${esc(r.zone)}</span><span class="font-bold">${r.duration} 分</span></div>`).join("")}</div>` : `<p class="text-[11px] text-slate-400 pt-2">此週僅保留統計（舊版歸檔）</p>`;
    return `<details class="p-4 bg-slate-50 rounded-2xl border border-slate-200/70"><summary class="cursor-pointer space-y-2">
      <div class="flex justify-between items-center"><span class="text-xs font-bold">${fmt(w.startDateStr)} ~ ${fmt(w.endDateStr)}</span>
      <span class="text-xs font-black ${w.totalMinutes >= w.targetMinutes ? "text-emerald-600" : "text-slate-500"}">${w.totalMinutes} / ${w.targetMinutes} 分鐘</span></div>
      <div class="flex flex-wrap gap-x-3 text-[11px] text-slate-500">${zs || "無區間資料"}<span>共 ${w.recordsCount} 筆</span></div></summary>
      ${detail}<div class="text-right pt-2"><button data-act="delhist" data-id="${esc(w.id)}" class="text-[11px] text-rose-500 p-2">刪除此週</button></div></details>`;
  }).join("");
}

/* ---------- 事件委派（編輯 / 刪除）---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === "edit") openSheet(id);
  if (b.dataset.act === "del") deleteRecord(id);
  if (b.dataset.act === "delhist" && confirm("確定刪除這一週的歷史紀錄？")) { appState.history = appState.history.filter((w) => w.id !== id); save(); renderApp(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeSheet(); closeGoalModal(); closeDateModal(); } });

/* ---------- 新增 / 編輯 Sheet ---------- */
function fillSelects(rec) {
  const days = Array.from({ length: 7 }, (_, i) => addDays(appState.startDateStr, i));
  const sel = rec ? rec.date : days.includes(today()) ? today() : days[0];
  if (!days.includes(sel)) days.push(sel);
  $("inDate").innerHTML = days.map((d) => `<option value="${d}" ${d === sel ? "selected" : ""}>${fmt(d)} (${WEEK[parseDate(d).getDay()]})</option>`).join("");
  const type = rec ? rec.type : appState.last.type;
  const types = appState.types.includes(type) ? appState.types : [...appState.types, type];
  $("inType").innerHTML = types.map((t) => `<option value="${esc(t)}" ${t === type ? "selected" : ""}>${esc(t)}</option>`).join("") + `<option value="__new__">＋ 新增種類…</option>`;
  const zone = rec ? rec.zone : appState.last.zone;
  $("inZone").innerHTML = ZONES.map((z) => `<option value="${z[0]}" ${z[0] === zone ? "selected" : ""}>${z[0]} (${z[3]})</option>`).join("");
}
function onTypeChange() {
  const sel = $("inType");
  if (sel.value !== "__new__") return;
  const name = (prompt("輸入新的運動種類名稱：") || "").trim().slice(0, 20);
  if (name) { if (!appState.types.includes(name)) appState.types.push(name); fillSelects({ date: $("inDate").value, type: name, zone: $("inZone").value }); }
  else sel.selectedIndex = 0;
}
function openSheet(id) {
  const rec = id ? appState.records.find((r) => r.id === id) : null;
  editingId = rec ? rec.id : null;
  if (!$("viewCurrent").offsetParent) switchTab("current");
  fillSelects(rec);
  $("inDur").value = rec ? rec.duration : ""; $("inNote").value = rec ? rec.note : "";
  $("sheetTitle").textContent = rec ? "編輯運動紀錄" : "新增運動紀錄";
  $("sheetSubmit").textContent = rec ? "儲存修改" : "加入運動紀錄";
  $("quickBtns").innerHTML = [5, 10, 15, 30, 60].map((n) => `<button type="button" onclick="addMinutesQuick(${n})" class="px-2.5 py-1.5 text-xs bg-slate-100 active:bg-slate-300 text-slate-700 font-semibold rounded-md border border-slate-200">+${n}</button>`).join("") + `<button type="button" onclick="$('inDur').value=''" class="px-2.5 py-1.5 text-xs text-slate-400">清除</button>`;
  $("sheetBg").classList.remove("hidden"); $("sheet").classList.remove("closed");
  setTimeout(() => $("inDur").focus(), 260);
}
function closeSheet() { $("sheet").classList.add("closed"); $("sheetBg").classList.add("hidden"); editingId = null; }
function addMinutesQuick(n) { $("inDur").value = (parseInt($("inDur").value, 10) || 0) + n; }
function handleSaveRecord(e) {
  e.preventDefault();
  const duration = parseInt($("inDur").value, 10);
  if (!duration || duration <= 0) return;
  const data = { date: $("inDate").value, type: $("inType").value, zone: $("inZone").value, duration, note: $("inNote").value.trim() };
  if (data.type === "__new__") return;
  if (editingId) { const r = appState.records.find((x) => x.id === editingId); Object.assign(r, data); showToast("已更新紀錄"); }
  else { appState.records.push({ id: Date.now().toString(), ...data }); showToast("已新增紀錄"); }
  appState.last = { type: data.type, zone: data.zone };
  save(); renderApp(); closeSheet();
}
function deleteRecord(id) {
  const idx = appState.records.findIndex((r) => r.id === id); if (idx < 0) return;
  const [removed] = appState.records.splice(idx, 1);
  save(); renderApp();
  showToast("已刪除紀錄", () => { appState.records.splice(idx, 0, removed); save(); renderApp(); });
}

/* ---------- 存檔 / 切換 ---------- */
function archiveCurrentWeek() {
  if (!confirm("確定要存檔並開始新的一週嗎？")) return;
  const { total, zones } = calcStats(appState.records), end = endOf(appState.startDateStr);
  appState.history.unshift({ id: Date.now().toString(), startDateStr: appState.startDateStr, endDateStr: end, targetMinutes: appState.targetMinutes,
    totalMinutes: total, zones, records: appState.records, recordsCount: appState.records.length, archivedAt: new Date().toISOString() });
  appState.startDateStr = addDays(end, 1);
  appState.records = [];
  save(); renderApp();
}
function switchTab(tab) {
  $("viewCurrent").classList.toggle("hidden", tab !== "current");
  $("viewHistory").classList.toggle("hidden", tab !== "history");
  [["current", "navCurrent"], ["history", "navHistory"]].forEach(([t, id]) => {
    $(id).className = "flex flex-col items-center gap-1 py-2.5 text-[11px] font-semibold " + (t === tab ? "text-sky-500" : "text-slate-400");
  });
  window.scrollTo({ top: 0 });
}
function updateThemeBtn() {
  $("themeBtn").innerHTML = `<i data-lucide="${document.documentElement.classList.contains("dark") ? "sun" : "moon"}" class="w-5 h-5"></i>`;
}
function toggleTheme() {
  const d = document.documentElement.classList.toggle("dark");
  try { localStorage.setItem("WF_THEME", d ? "dark" : "light"); } catch (e) {}
  updateThemeBtn(); lucide.createIcons();
}

/* ---------- Modals ---------- */
function openGoalModal() { $("modalGoalInput").value = appState.targetMinutes; $("goalModal").classList.remove("hidden"); }
function closeGoalModal() { $("goalModal").classList.add("hidden"); }
function saveGoalModal() { const v = parseInt($("modalGoalInput").value, 10); if (v > 0) { appState.targetMinutes = v; save(); renderApp(); closeGoalModal(); } }
function openDateModal() { $("modalStartDateInput").value = appState.startDateStr; updateModalRangePreview(); $("dateModal").classList.remove("hidden"); }
function closeDateModal() { $("dateModal").classList.add("hidden"); }
function updateModalRangePreview() { const s = $("modalStartDateInput").value; if (s) $("modalRangePreviewText").textContent = `${fmt(s)} ~ ${fmt(endOf(s))}`; }
function saveDateModal() { const s = $("modalStartDateInput").value; if (s) { appState.startDateStr = s; save(); renderApp(); closeDateModal(); } }

/* ---------- 匯出 / 匯入 ---------- */
function exportDataJSON() {
  appState.lastBackup = today(); save();
  const url = URL.createObjectURL(new Blob([JSON.stringify(appState, null, 2)], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = `WeeklyFit_Backup_${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  renderApp();
}
function importDataJSON(event) {
  const input = event.target, file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || typeof data !== "object" || !Array.isArray(data.records)) throw new Error("bad");
      if (!confirm(`將以備份覆蓋目前資料（${data.records.length} 筆本週紀錄、${(data.history || []).length} 週歷史）。確定嗎？`)) return;
      appState = sanitize(data); save(); renderApp(); alert("備份資料已順利匯入並還原！");
    } catch (err) { alert("匯入失敗：檔案格式不正確"); }
    finally { input.value = ""; }
  };
  reader.readAsText(file);
}

/* ---------- 圖示 / 初始化 ---------- */
function generateAppIcons() {
  const cv = document.createElement("canvas"); cv.width = cv.height = 180;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#0f172a"; ctx.beginPath(); (ctx.roundRect ? ctx.roundRect(0, 0, 180, 180, 40) : ctx.rect(0, 0, 180, 180)); ctx.fill();
  ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 12; ctx.lineCap = ctx.lineJoin = "round"; ctx.beginPath();
  [[25,90],[55,90],[75,45],[95,135],[115,70],[130,90],[155,90]].forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.stroke();
  const u = cv.toDataURL("image/png"); $("apple-touch-icon").href = u; $("app-favicon").href = u;
}
window.addEventListener("DOMContentLoaded", () => { generateAppIcons(); load(); switchTab("current"); updateThemeBtn(); renderApp(); });
</script>
</body>
</html>
